<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#fbfbfa"/>
  <style>
    .serif{font-family:Georgia,'Times New Roman',serif;fill:#151719}
    .sans{font-family:Inter,Arial,sans-serif;fill:#243447}
    .muted{fill:#687786}
    .box{fill:#f3f6f8;stroke:#d8e0e6;stroke-width:2}
    .line{stroke:#4d6072;stroke-width:3;fill:none}
    .dash{stroke:#93a2af;stroke-width:2;stroke-dasharray:8 8}
    .pill{fill:#e8eef3;stroke:#d3dde5;stroke-width:1.5}
  </style>
  <text x="800" y="78" text-anchor="middle" class="serif" font-size="54" font-weight="700">Same Task Success, Different Humans</text>
  <text x="800" y="120" text-anchor="middle" class="sans muted" font-size="22" letter-spacing="4">POST-ASSISTANCE JUDGMENT</text>

  <text x="110" y="185" class="sans muted" font-size="18" letter-spacing="3">ASSISTED PHASE</text>
  <rect x="90" y="215" rx="18" ry="18" width="430" height="180" class="box"/>
  <text x="125" y="270" class="serif" font-size="32" font-weight="700">Frame-supplying assistance</text>
  <text x="125" y="315" class="sans" font-size="22">AI may supply the frame, hypotheses,</text>
  <text x="125" y="347" class="sans" font-size="22">experiment ranking, and next action.</text>
  <text x="125" y="376" class="sans muted" font-size="18">Same underlying model capability</text>

  <rect x="90" y="435" rx="18" ry="18" width="430" height="180" class="box"/>
  <text x="125" y="490" class="serif" font-size="32" font-weight="700">Frame-eliciting assistance</text>
  <text x="125" y="535" class="sans" font-size="22">AI first elicits competing frames,</text>
  <text x="125" y="567" class="sans" font-size="22">uncertainties, and falsifying evidence.</text>
  <text x="125" y="596" class="sans muted" font-size="18">Same underlying model capability</text>

  <path d="M520 305 C590 305 600 360 650 360" class="line"/>
  <path d="M520 525 C590 525 600 430 650 430" class="line"/>
  <rect x="650" y="315" rx="16" ry="16" width="270" height="170" class="pill"/>
  <text x="785" y="365" text-anchor="middle" class="serif" font-size="30" font-weight="700">Matched assisted</text>
  <text x="785" y="402" text-anchor="middle" class="serif" font-size="30" font-weight="700">performance</text>
  <text x="785" y="444" text-anchor="middle" class="sans muted" font-size="18">equivalence, not</text>
  <text x="785" y="469" text-anchor="middle" class="sans muted" font-size="18">“no significant difference”</text>

  <line x1="970" y1="195" x2="970" y2="650" class="dash"/>
  <text x="970" y="180" text-anchor="middle" class="sans muted" font-size="17" letter-spacing="2">AI REMOVED</text>

  <path d="M920 400 L1015 400" class="line"/>
  <polygon points="1015,400 996,389 996,411" fill="#4d6072"/>

  <rect x="1045" y="230" rx="18" ry="18" width="460" height="370" class="box"/>
  <text x="1080" y="285" class="sans muted" font-size="18" letter-spacing="3">UNFRAMED TRANSFER</text>
  <text x="1080" y="335" class="serif" font-size="32" font-weight="700">Novel environment</text>
  <text x="1080" y="378" class="sans" font-size="22">• different latent cause</text>
  <text x="1080" y="413" class="sans" font-size="22">• different surface features</text>
  <text x="1080" y="448" class="sans" font-size="22">• fixed investigation budget</text>
  <text x="1080" y="483" class="sans" font-size="22">• no stated problem</text>
  <text x="1080" y="532" class="serif" font-size="29" font-weight="700">J<tspan baseline-shift="sub" font-size="20">post</tspan><tspan baseline-shift="baseline">(A)  ?  J</tspan><tspan baseline-shift="sub" font-size="20">post</tspan><tspan baseline-shift="baseline">(B)</tspan></text>
  <text x="1080" y="568" class="sans muted" font-size="18">H₀: equal   ·   H₁: different</text>

  <rect x="90" y="690" rx="16" ry="16" width="1415" height="120" fill="#edf2f5" stroke="#d8e0e6" stroke-width="2"/>
  <text x="130" y="735" class="sans muted" font-size="17" letter-spacing="3">PRIMARY QUESTION</text>
  <text x="800" y="780" text-anchor="middle" class="serif" font-size="34" font-weight="700">Can equal success with AI leave behind different independent judgment?</text>
  <text x="800" y="842" text-anchor="middle" class="sans muted" font-size="18">Measure: Research Utility · Oracle Regret · investigation choice · frame revision · stopping · action</text>
</svg>
