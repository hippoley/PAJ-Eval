name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
      - name: Python contract tests
        run: pytest -q
      - name: Release gate consistency
        run: python scripts/check_release_gate.py
      - name: Browser and durable-session JavaScript tests
        run: node --test tests/transport.test.js tests/player_syntax.test.js tests/challenge_syntax.test.js tests/challenge_depth.test.js tests/challenge_review.test.js tests/pf02_challenge.test.js tests/pf03_challenge.test.js tests/pf04_challenge.test.js tests/pf05_challenge.test.js tests/pf06_challenge.test.js tests/pf07_challenge.test.js tests/pf08_challenge.test.js tests/golden_suite_contract.test.js tests/challenge_suite.test.js tests/golden_event_normalizer.test.js tests/golden_study_bridge.test.js tests/run_router.test.js tests/research_browser.test.js tests/stage_preview.test.js tests/journey01_guidance.test.js tests/golden_ingest_contract.test.js
