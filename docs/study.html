<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAJ-Eval · Research Session</title>
<style>
:root{--bg:#f1efe8;--paper:#fffefa;--ink:#18191d;--muted:#70747d;--line:#ddd9cf;--dark:#202227}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,"Noto Sans",system-ui,sans-serif}.wrap{max-width:780px;margin:auto;padding:24px 18px 70px}.top{font:11px ui-monospace,monospace;letter-spacing:.1em;color:var(--muted);padding:8px 0 56px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:28px}h1{font-size:clamp(42px,7vw,64px);line-height:1;letter-spacing:-.05em;margin:8px 0 22px}.lead{font-size:19px;color:#454951}.muted{color:var(--muted)}.consent{display:flex;gap:10px;align-items:flex-start;margin:22px 0;padding:15px;border:1px solid var(--line);border-radius:12px;background:#faf8f2}.consent input{margin-top:4px}.primary{border:0;border-radius:11px;padding:12px 16px;background:var(--dark);color:white;font:inherit;font-weight:700;cursor:pointer}.primary:disabled{opacity:.45;cursor:not-allowed}.error{border-left:3px solid #9b3e2c;background:#fff3ef;padding:12px 14px;margin-top:16px}.facts{display:grid;gap:9px;margin:20px 0}.fact{padding:10px 0;border-bottom:1px solid var(--line)}select{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:white}</style></head>
<body><main class="wrap"><div class="top">PAJ-EVAL / FORMAL RESEARCH SESSION</div><section class="card"><div style="display:flex;justify-content:flex-end"><select id="locale"></select></div><h1 id="title"></h1><p id="lead" class="lead"></p><div id="facts" class="facts"></div><label class="consent"><input id="agree" type="checkbox"><span id="consentText"></span></label><button id="begin" class="primary" disabled></button><div id="error" class="error" hidden></div></section></main>
<script>
const COPY={
'zh-CN':{native:'简体中文',title:'研究参与确认',lead:'接下来是一个短的交互任务。请按你平时真的会做的方式操作。',facts:['系统会记录你在任务中的点击、打开顺序、选择和用时。','不会要求你输入姓名、电话、地址或其他身份信息。','完成任务后，记录会安全保存，用于研究不同交互过程中的判断行为。','你可以在开始前退出；开始后也可以随时关闭页面。'],consent:'我已阅读以上说明，并同意本次研究会话保存这些交互记录。',begin:'同意并开始 →',bad:'这个研究链接配置不完整，请联系研究人员。'},
'zh-TW':{native:'繁體中文',title:'研究參與確認',lead:'接下來是一個短的互動任務。請按你平常真的會做的方式操作。',facts:['系統會記錄任務中的點擊、開啟順序、選擇與用時。','不會要求輸入姓名、電話、地址或其他身分資訊。','完成後，紀錄會安全儲存，用於研究不同互動過程中的判斷行為。','開始前可退出；開始後也可隨時關閉頁面。'],consent:'我已閱讀以上說明，並同意本次研究工作階段儲存這些互動紀錄。',begin:'同意並開始 →',bad:'這個研究連結設定不完整，請聯絡研究人員。'},
en:{native:'English',title:'Research participation',lead:'Next is a short interactive task. Use it the way you naturally would.',facts:['The system records clicks, opening order, choices, and timing within the task.','The task does not ask for your name, phone number, address, or other identifying details.','After completion, the interaction record is stored for research on judgment during interactive work.','You may leave before starting, and you may close the page at any time after starting.'],consent:'I have read the information above and consent to this research session storing these interaction records.',begin:'Consent and begin →',bad:'This research link is not configured correctly. Please contact the researcher.'},
ja:{native:'日本語',title:'研究参加の確認',lead:'このあと短いインタラクティブ課題があります。普段どおりに操作してください。',facts:['課題内のクリック、開く順序、選択、経過時間を記録します。','氏名、電話番号、住所などの識別情報の入力は求めません。','完了後、判断行動の研究のために操作記録を保存します。','開始前に退出でき、開始後もいつでもページを閉じられます。'],consent:'上記を読み、この研究セッションで操作記録を保存することに同意します。',begin:'同意して開始 →',bad:'研究リンクの設定が不完全です。研究担当者に連絡してください。'},
ko:{native:'한국어',title:'연구 참여 확인',lead:'다음은 짧은 상호작용 과제입니다. 평소 하듯이 사용해 주세요.',facts:['과제 안의 클릭, 열람 순서, 선택, 시간을 기록합니다.','이름, 전화번호, 주소 등 식별 정보를 입력하도록 요구하지 않습니다.','완료 후 상호작용 기록은 판단 행동 연구를 위해 저장됩니다.','시작 전 나갈 수 있고, 시작 후에도 언제든 페이지를 닫을 수 있습니다.'],consent:'위 내용을 읽었으며 이 연구 세션이 이러한 상호작용 기록을 저장하는 데 동의합니다.',begin:'동의하고 시작 →',bad:'연구 링크 설정이 올바르지 않습니다. 연구 담당자에게 문의하세요.'},
es:{native:'Español',title:'Participación en investigación',lead:'A continuación hay una tarea interactiva breve. Úsala como lo harías normalmente.',facts:['Se registran clics, orden de apertura, elecciones y tiempos dentro de la tarea.','No se solicita nombre, teléfono, dirección ni otros datos identificativos.','Al terminar, el registro se guarda para investigar el juicio durante tareas interactivas.','Puedes salir antes de empezar y cerrar la página en cualquier momento después.'],consent:'He leído la información y acepto que esta sesión de investigación guarde estos registros de interacción.',begin:'Aceptar y comenzar →',bad:'Este enlace de investigación no está configurado correctamente.'},
fr:{native:'Français',title:'Participation à la recherche',lead:'Vous allez effectuer une courte tâche interactive. Utilisez-la comme vous le feriez naturellement.',facts:['Les clics, l’ordre d’ouverture, les choix et le temps passé sont enregistrés.','La tâche ne demande ni nom, ni téléphone, ni adresse, ni autre identifiant.','À la fin, l’historique d’interaction est conservé pour étudier le jugement dans le travail interactif.','Vous pouvez quitter avant de commencer et fermer la page à tout moment ensuite.'],consent:'J’ai lu ces informations et j’accepte que cette session de recherche conserve ces interactions.',begin:'Accepter et commencer →',bad:'Ce lien de recherche est mal configuré.'},
de:{native:'Deutsch',title:'Teilnahme an der Forschung',lead:'Als Nächstes folgt eine kurze interaktive Aufgabe. Nutze sie so, wie du es normalerweise tun würdest.',facts:['Erfasst werden Klicks, Öffnungsreihenfolge, Entscheidungen und Zeit innerhalb der Aufgabe.','Die Aufgabe fragt nicht nach Name, Telefonnummer, Adresse oder anderen Identifikationsdaten.','Nach Abschluss wird der Interaktionsverlauf für Forschung zu Urteilen bei interaktiver Arbeit gespeichert.','Du kannst vor Beginn aussteigen und die Seite danach jederzeit schließen.'],consent:'Ich habe die Informationen gelesen und stimme der Speicherung dieser Interaktionsdaten für diese Forschungssitzung zu.',begin:'Zustimmen und starten →',bad:'Dieser Forschungslink ist nicht korrekt konfiguriert.'},
pt:{native:'Português',title:'Participação na pesquisa',lead:'A seguir há uma tarefa interativa curta. Use-a como você usaria normalmente.',facts:['São registrados cliques, ordem de abertura, escolhas e tempo dentro da tarefa.','A tarefa não pede nome, telefone, endereço nem outros dados de identificação.','Ao concluir, o registro de interação é armazenado para pesquisa sobre julgamento em trabalho interativo.','Você pode sair antes de começar e fechar a página a qualquer momento depois.'],consent:'Li as informações acima e concordo que esta sessão de pesquisa armazene esses registros de interação.',begin:'Concordar e começar →',bad:'Este link de pesquisa não está configurado corretamente.'},
ru:{native:'Русский',title:'Участие в исследовании',lead:'Далее будет короткая интерактивная задача. Работайте так, как обычно.',facts:['Записываются клики, порядок открытия, выборы и время внутри задачи.','Задача не просит имя, телефон, адрес или другие идентифицирующие данные.','После завершения запись взаимодействий сохраняется для исследования принятия решений в интерактивной работе.','До начала можно выйти, а после начала — закрыть страницу в любой момент.'],consent:'Я прочитал(а) информацию выше и согласен(на) на сохранение этих записей взаимодействия в рамках исследования.',begin:'Согласиться и начать →',bad:'Ссылка на исследование настроена неправильно.'}
};
const JOURNEYS={'01':'PF01','02':'PF02','03':'PF03','04':'PF04','05':'PF05','06':'PF06','07':'PF07','08':'PF08'};
const params=new URLSearchParams(location.search),journey=params.get('journey')||'',initial=params.get('locale')||'en';
let locale=COPY[initial]?initial:'en';const $=id=>document.getElementById(id);
for(const [k,v] of Object.entries(COPY)){const o=document.createElement('option');o.value=k;o.textContent=v.native;$('locale').appendChild(o)}
function render(){const c=COPY[locale];$('locale').value=locale;$('title').textContent=c.title;$('lead').textContent=c.lead;$('facts').innerHTML=c.facts.map(x=>'<div class="fact">'+x+'</div>').join('');$('consentText').textContent=c.consent;$('begin').textContent=c.begin;if(!JOURNEYS[journey]){$('error').hidden=false;$('error').textContent=c.bad;$('begin').disabled=true}}
$('locale').onchange=e=>{locale=e.target.value;$('agree').checked=false;$('begin').disabled=true;render()};
$('agree').onchange=e=>$('begin').disabled=!e.target.checked||!JOURNEYS[journey];
$('begin').onclick=()=>{if(!$('agree').checked||!JOURNEYS[journey])return;const ctx={consent_version:'golden-consent-v1',client_submission_id:crypto.randomUUID(),family:JOURNEYS[journey],journey,locale,issued_at:Date.now(),completed:false};sessionStorage.setItem('paj_golden_study_v1',JSON.stringify(ctx));location.href='run.html?journey='+encodeURIComponent(journey)+'&locale='+encodeURIComponent(locale)+'&study=1'};
render();
</script></body></html>
