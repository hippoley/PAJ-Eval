<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAJ-Eval · Live Worlds</title><style>:root{--bg:#eeece5;--paper:#fffefa;--ink:#17181c;--muted:#737780;--line:#dcd8ce;--hot:#b9583d;--dark:#1d1f24;--ok:#2f7154;--warn:#9a681e;--bad:#9b3e2c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,sans-serif}.wrap{max-width:1120px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;font:11px ui-monospace,monospace;letter-spacing:.1em;color:var(--muted);padding:8px 0 24px}.topRight{display:flex;gap:8px;align-items:center}.badge{display:inline-flex;gap:7px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:#fff9;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}select,button{font:inherit}select{border:1px solid var(--line);background:white;border-radius:9px;padding:7px 9px}h1{font-size:clamp(46px,7vw,78px);line-height:.96;letter-spacing:-.055em;margin:15px 0 22px;max-width:900px}h2{font-size:30px;letter-spacing:-.03em;margin:8px 0}.lead{font-size:20px;color:#42464e;max-width:760px}.hero{padding:5vh 0 2vh}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:30px 0}.world{min-height:190px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:17px;cursor:pointer;transition:.18s}.world:hover{transform:translateY(-3px);box-shadow:0 16px 40px #29251c14}.id{font:11px ui-monospace,monospace;color:var(--hot)}.world b{display:block;font-size:18px;margin:10px 0}.world p,.muted{color:var(--muted)}button{cursor:pointer}.primary{border:0;background:var(--dark);color:white;border-radius:11px;padding:12px 17px}.ghost{border:1px solid var(--line);background:white;border-radius:11px;padding:11px 15px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 20px 60px #29251c12}.playhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.body{display:grid;grid-template-columns:1.1fr .9fr;min-height:540px}.story{padding:32px}.objects{padding:22px;background:#f7f4ed;border-left:1px solid var(--line)}.obj{width:100%;text-align:left;border:1px solid var(--line);background:white;border-radius:13px;padding:13px;margin:5px 0}.obj b{display:block}.obj small{color:var(--muted)}.obj:disabled{opacity:.48}.reveal{border-left:3px solid var(--hot);padding:13px 15px;background:#fff6ed;margin:18px 0}.choices{display:grid;gap:8px;margin-top:20px}.choice{border:1px solid var(--line);background:white;border-radius:12px;padding:13px;text-align:left}.choice:hover{border-color:#999}.hidden{display:none!important}.done{max-width:820px;margin:7vh auto;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:30px}.save{display:inline-block;padding:6px 10px;border-radius:99px;background:#e8f0ea;color:var(--ok);font-size:12px}.save.warn{background:#fff4dd;color:var(--warn)}.save.bad{background:#fee8e3;color:var(--bad)}.trace{background:var(--dark);color:#eee;border-radius:14px;padding:14px;font:12px ui-monospace,monospace;max-height:260px;overflow:auto;margin:18px 0}.trace div{padding:6px 0;border-bottom:1px solid #35383f}.consent{display:flex;gap:9px;align-items:flex-start;max-width:780px;margin:18px 0;color:var(--muted)}.mode{padding:13px 15px;border:1px solid var(--line);background:#f8f6ef;border-radius:12px;max-width:780px}.mode label{margin-right:20px}.tiny{font-size:12px;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.body{grid-template-columns:1fr}.objects{border-left:0;border-top:1px solid var(--line)}}@media(max-width:480px){.grid{grid-template-columns:1fr}h1{font-size:48px}.top{align-items:flex-start;flex-direction:column}.topRight{width:100%;justify-content:space-between}}</style><script src="locales.js"></script></head><body><main class="wrap"><header class="top"><b>PAJ-EVAL / LIVE WORLDS</b><div class="topRight"><select id="locale"></select><span class="badge"><i class="dot" id="dot"></i><span id="globalStatus">CONNECTED</span></span></div></header><section id="home"><div class="hero"><div class="id">PLAYABLE JUDGMENT INSTRUMENT · V4.1</div><h1 id="homeTitle"></h1><p class="lead" id="homeLead"></p><p class="muted" id="privacy"></p><label class="consent"><input id="consent" type="checkbox"><span id="consentText">I consent to anonymous trajectory storage for PAJ-Eval instrument development.</span></label><div class="mode"><label><input type="radio" name="mode" value="server" checked> <span id="serverMode">Research server + offline retry</span></label><label><input type="radio" name="mode" value="local"> <span id="localMode">Local only</span></label><div class="tiny" id="queueInfo"></div></div></div><div class="grid" id="grid"></div></section><section id="player" class="hidden"><div class="panel"><div class="playhead"><div><span class="id" id="pid"></span> · <span id="pname"></span></div><button class="ghost" onclick="back()" id="backBtn">← Probe library</button></div><div class="body"><div class="story"><div class="id">SITUATION</div><h2 id="title"></h2><p class="lead" id="situation"></p><div id="reveal" class="reveal hidden"></div><div class="id" style="margin-top:28px" id="readyLabel"></div><div class="choices" id="choices"></div></div><aside class="objects"><div class="id" id="objectsLabel"></div><p class="muted">No required item. You may decide immediately.</p><div id="objects"></div></aside></div></div></section><section id="done" class="done hidden"><span class="save" id="save"></span><h2 id="doneTitle">Raw trajectory captured.</h2><p id="result" class="lead"></p><p class="muted" id="trajectoryNote"></p><div class="trace" id="trace"></div><button class="primary" onclick="back()" id="againBtn"></button></section></main><script>
const ENDPOINT='https://pwdcgfvarudhqezlzwmx.supabase.co/functions/v1/ingest-probe';
const DB='paj-eval-queue-v1', STORE='submissions'; let cur=null,t0=0,ev=[],locale='en'; const $=x=>document.getElementById(x);
const idb=()=>new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'client_submission_id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
async function qPut(v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(v);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function qDelete(id){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function qAll(){const db=await idb();return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tr(){return window.PAJ_LOCALES[locale]}
function splitObj(s){const p=s.indexOf('|');return p<0?[s,'']:[s.slice(0,p),s.slice(p+1)]}
function setStatus(kind,text){$('globalStatus').textContent=text;$('dot').className='dot'+(kind==='warn'?' warn':kind==='bad'?' bad':'')}
async function refreshQueue(){try{const n=(await qAll()).length;$('queueInfo').textContent=n?`${n} pending submission(s) on this device.`:''}catch{}}
function renderLocale(){const L=tr();document.documentElement.lang=locale;document.body.style.fontFamily=L.font;$('homeTitle').textContent=L.ui.homeTitle;$('homeLead').textContent=L.ui.homeLead;$('privacy').textContent=L.ui.privacy;$('objectsLabel').textContent=L.ui.objects;$('readyLabel').textContent=L.ui.ready;$('backBtn').textContent='← '+L.ui.library;$('trajectoryNote').textContent=L.ui.trajectory;$('againBtn').textContent=L.ui.again;renderGrid()}
function renderGrid(){$('grid').innerHTML='';Object.entries(tr().pf).forEach(([id,p])=>{const d=document.createElement('div');d.className='world';d.innerHTML=`<span class="id">${id}</span><b>${p[0]}</b><p>${p[1]}</p>`;d.onclick=()=>openWorld(id);$('grid').appendChild(d)})}
function log(event,target){ev.push({event,target,t:Date.now()-t0,locale,screen:cur.id})}
function openWorld(id){if(!$('consent').checked){$('consent').focus();$('consentText').style.color='#9b3e2c';return}const p=tr().pf[id];cur={id,p};ev=[];t0=Date.now();log('probe_started',id);$('home').classList.add('hidden');$('done').classList.add('hidden');$('player').classList.remove('hidden');$('pid').textContent=id;$('pname').textContent=p[0];$('title').textContent=p[0];$('situation').textContent=p[2];$('reveal').classList.add('hidden');$('objects').innerHTML='';$('choices').innerHTML='';p[3].forEach((raw,j)=>{const o=splitObj(raw),b=document.createElement('button');b.className='obj';b.innerHTML=`<b>${o[0]}</b><small>${o[1]}</small>`;b.onclick=()=>{log('inspect','object_'+j);b.disabled=true;$('reveal').textContent=p[4];$('reveal').classList.remove('hidden')};$('objects').appendChild(b)});p[5].forEach((c,j)=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>finish(j,c);$('choices').appendChild(b)})}
async function postPayload(payload){const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'save_failed');return j}
async function retryQueue(){if(!navigator.onLine)return;let items=[];try{items=await qAll()}catch{return}if(!items.length){setStatus('ok','CONNECTED');return}setStatus('warn','RETRYING');for(const item of items){try{await postPayload(item);await qDelete(item.client_submission_id)}catch{setStatus('warn','OFFLINE QUEUE');await refreshQueue();return}}setStatus('ok','CONNECTED');await refreshQueue()}
async function finish(i,c){log('commit','choice_'+i);$('player').classList.add('hidden');$('done').classList.remove('hidden');$('result').textContent=c;$('trace').innerHTML=ev.map((e,n)=>`<div>#${n+1} · ${e.t}ms · ${e.event} · ${e.target}</div>`).join('');const localOnly=document.querySelector('input[name=mode]:checked').value==='local';if(localOnly){$('save').className='save warn';$('save').textContent=tr().ui.local;localStorage.setItem('paj_local_trace',JSON.stringify({locale,probe_family:cur.id,events:ev,terminal_action:'choice_'+i}));return}const payload={client_submission_id:crypto.randomUUID(),locale,instrument_version:'probe-player-v4.1',probe_family:cur.id,world_variant:'localized_01',events:ev,terminal_action:'choice_'+i};$('save').className='save';$('save').textContent=tr().ui.saving;try{const j=await postPayload(payload);$('save').textContent=tr().ui.saved+' · '+j.session_id.slice(0,8);localStorage.setItem('paj_last_session',j.session_id);setStatus('ok','CONNECTED')}catch(e){try{await qPut(payload);$('save').className='save warn';$('save').textContent=tr().ui.failed+' · '+tr().ui.queued;setStatus('warn','OFFLINE QUEUE');await refreshQueue()}catch{$('save').className='save bad';$('save').textContent=tr().ui.failed;setStatus('bad','SAVE FAILED')}}}
function back(){$('player').classList.add('hidden');$('done').classList.add('hidden');$('home').classList.remove('hidden');scrollTo(0,0)}
Object.entries(window.PAJ_LOCALES).forEach(([code,L])=>{const o=document.createElement('option');o.value=code;o.textContent=L.native;$('locale').appendChild(o)});$('locale').value=locale;$('locale').onchange=e=>{locale=e.target.value;renderLocale()};window.addEventListener('online',retryQueue);window.addEventListener('load',()=>{renderLocale();refreshQueue();retryQueue()});
</script></body></html>
