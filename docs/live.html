<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAJ-Eval · Live Probe</title><style>body{margin:0;background:#f3f1eb;color:#191a1e;font:16px/1.55 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:760px;margin:0 auto;padding:32px 18px}.card{background:#fffefa;border:1px solid #dedbd2;border-radius:20px;padding:24px;margin:16px 0}.muted{color:#70747d}.status{font-size:13px;padding:6px 10px;border-radius:99px;background:#eee}.objects{display:grid;gap:9px}.obj,button{font:inherit;border:1px solid #d8d5cc;background:white;border-radius:12px;padding:13px;text-align:left;cursor:pointer}.obj b{display:block}.obj small{color:#70747d}.choices button{display:block;width:100%;margin:8px 0}.primary{background:#1c1e23;color:white}h1{font-size:42px;line-height:1.05}.hidden{display:none}.trace{font:12px ui-monospace,monospace;background:#1c1e23;color:#eee;padding:14px;border-radius:12px;max-height:230px;overflow:auto}</style></head><body><main class="wrap"><div id="intro" class="card"><span class="status">LIVE · 持久化实验</span><h1>一个很短的判断世界</h1><p>没有标准点击顺序。按你真实工作时会做的方式看看，然后做决定。</p><p class="muted">继续即表示你同意把本次匿名交互轨迹用于 PAJ-Eval 的研究仪器开发。不会要求姓名、邮箱或精确位置。</p><button class="primary" onclick="start()">开始</button></div><div id="play" class="card hidden"><div class="muted">PF07 · 实验版</div><h2>一份看起来很完整的方案</h2><p>助手给出了一份非常完整的优化方案。它内部逻辑一致，也确实优化了被指定的指标。你现在要决定下一步。</p><div class="objects" id="objects"></div><div id="reveal" class="card hidden"></div><h3>准备好以后</h3><div class="choices" id="choices"></div></div><div id="done" class="card hidden"><span class="status" id="save">正在保存…</span><h2>这次不是只留在浏览器里。</h2><p id="result"></p><p class="muted">这里保存的是原始行为轨迹，不是人格分数。后续 evaluator 会从原始事件生成可版本化的 features / constructs / evaluation。</p><div class="trace" id="trace"></div><button onclick="location.reload()">再来一次</button></div></main><script>const ENDPOINT='https://pwdcgfvarudhqezlzwmx.supabase.co/functions/v1/ingest-probe';let t0=0,ev=[];const objects=[['方案','查看助手建议'],['原始请求','最开始到底问了什么'],['利益相关者备注','真正痛点是什么'],['指标定义','成功到底如何计算'],['约束','实际不能突破的边界']];const choices=['执行现有方案','先重新定义问题','要求继续优化现有方案'];function log(event,target){ev.push({event,target,t:Date.now()-t0,locale:'zh-CN',screen:'PF07-live'})}function start(){t0=Date.now();log('probe_started','PF07');intro.classList.add('hidden');play.classList.remove('hidden');objects.forEach((x,i)=>{let b=document.createElement('button');b.className='obj';b.innerHTML='<b>'+x[0]+'</b><small>'+x[1]+'</small>';b.onclick=()=>{log('inspect','object_'+i);b.disabled=true;reveal.classList.remove('hidden');reveal.textContent=i===2?'备注里反复出现的是上线后的人工返工，而不是当前被优化的速度指标。':'你查看了：'+x[0];};document.querySelector('#objects').appendChild(b)});choices.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>finish(i,x);document.querySelector('#choices').appendChild(b)})}async function finish(i,x){log('commit','choice_'+i);play.classList.add('hidden');done.classList.remove('hidden');result.textContent='你的决定：'+x;trace.innerHTML=ev.map((e,n)=>'<div>#'+(n+1)+' '+e.t+'ms · '+e.event+' · '+e.target+'</div>').join('');try{let r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({locale:'zh-CN',instrument_version:'probe-player-v4-live',probe_family:'PF07',world_variant:'wrong_problem_live_01',events:ev,terminal_action:'choice_'+i})});let j=await r.json();if(!r.ok||!j.ok)throw Error();save.textContent='已保存 · '+j.session_id.slice(0,8);localStorage.setItem('paj_last_session',j.session_id)}catch(e){save.textContent='保存失败 · 原始轨迹仍在本页';save.style.background='#fee'}};</script></body></html>
