<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAJ-Eval · Three Systems Challenge</title>
<style>
:root{--bg:#f1efe8;--paper:#fffefa;--ink:#18191d;--muted:#737780;--line:#ddd9cf;--soft:#f7f4ed;--dark:#202227;--hot:#b85a3e;--ok:#2f7154}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,"Noto Sans",system-ui,sans-serif}.app{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:5px 0 15px;font:11px ui-monospace,monospace;letter-spacing:.1em;color:var(--muted)}select,button{font:inherit}.screen{min-height:83vh;display:flex;align-items:center}.hidden{display:none!important}.hero{max-width:820px}.ey,.mono{font:11px ui-monospace,monospace;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(44px,7vw,76px);line-height:.99;letter-spacing:-.05em;margin:10px 0 22px}h2{font-size:30px;letter-spacing:-.03em;margin:4px 0 8px}.lead{font-size:19px;color:#454951;max-width:820px}.help,.meta{font-size:13px;color:var(--muted)}.btn,.primary{border-radius:10px;padding:10px 13px;cursor:pointer}.btn{border:1px solid var(--line);background:#fff}.primary{border:0;background:var(--dark);color:#fff;font-weight:700}.link{border:0;background:transparent;text-decoration:underline;cursor:pointer;padding:4px;color:inherit}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:12px}.workspace{width:100%;display:grid;grid-template-columns:225px minmax(0,1fr);min-height:690px;background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 18px 55px #2a271f10}.nav{padding:17px;background:var(--soft);border-right:1px solid var(--line)}.nav .brand{font:11px ui-monospace,monospace;color:var(--muted);margin-bottom:12px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:10px;margin:3px 0;cursor:pointer;color:#3e424a}.nav button.active,.nav button:hover{background:#e9e5da;color:#111}.main{padding:25px;min-width:0}.crumb{font:11px ui-monospace,monospace;color:var(--muted);margin-bottom:17px}.metricGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.card,.panel{border:1px solid var(--line);border-radius:15px;background:#fff;padding:16px}.metric b{display:block;font-size:25px;letter-spacing:-.03em}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{color:var(--muted);font-weight:500}.log{background:var(--dark);color:#eee;border-radius:13px;padding:12px;font:12px ui-monospace,monospace}.log div{padding:7px 0;border-bottom:1px solid #3b3e45}.notice{border-left:3px solid var(--hot);background:#fff7ed;padding:13px 15px;margin:14px 0}.good{border-left-color:var(--ok);background:#eef7f1}.actions{border-top:1px solid var(--line);margin-top:24px;padding-top:16px}.actions h3{margin:0 0 10px}.spark{height:80px;display:flex;gap:6px;align-items:flex-end;margin:12px 0}.spark i{flex:1;background:#d6d1c7;border-radius:5px 5px 2px 2px}.spark i:last-child{background:#c88771}.moment{max-width:760px;margin:auto;text-align:center}.moment p{font:30px/1.35 Georgia,"Songti SC",serif}.moment .signal{color:var(--hot)}.progress{display:flex;gap:7px;margin-top:18px}.progress span{height:7px;flex:1;border-radius:99px;background:#ddd8ce}.progress span.on{background:var(--dark)}.summary{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;width:100%}.trace{background:var(--dark);color:#eee;border-radius:13px;padding:13px;font:12px ui-monospace,monospace;max-height:430px;overflow:auto}.trace div{padding:6px 0;border-bottom:1px solid #3a3d44}.count{font-size:30px;font-weight:800}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:4px 8px;font-size:11px;margin:2px}.research{border-left:3px solid var(--hot);background:#fff7ed;padding:14px;margin-top:13px}@media(max-width:780px){.workspace{grid-template-columns:1fr}.nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.nav .brand{display:none}.nav button{min-width:140px;width:auto;white-space:nowrap}.metricGrid,.summary{grid-template-columns:1fr}.main{padding:18px}.screen{min-height:88vh}.moment p{font-size:24px}}</style>
<script src="pf02-packs.js"></script></head>
<body><div class="app"><header class="top"><b>PAJ-EVAL / THREE SYSTEMS</b><div><span id="market" class="pill"></span> <select id="locale"></select></div></header>
<section id="intro" class="screen"><div class="hero"><div id="introEy" class="ey"></div><h1 id="introTitle"></h1><p id="introLead" class="lead"></p><button id="start" class="primary"></button><p id="introHelp" class="help"></p><div class="progress"><span class="on"></span><span></span><span></span><span></span></div></div></section>
<section id="seed" class="screen hidden"><div class="workspace"><aside id="seedNav" class="nav"></aside><main class="main"><div id="seedCrumb" class="crumb"></div><div id="seedContent"></div><div id="seedActions" class="actions"></div></main></div></section>
<section id="cue" class="screen hidden"><div class="moment"><div id="cueEy" class="ey"></div><p id="cueLine" class="signal"></p><button id="cueNext" class="primary"></button><div class="progress"><span class="on"></span><span class="on"></span><span></span><span></span></div></div></section>
<section id="near" class="screen hidden"><div class="workspace"><aside id="nearNav" class="nav"></aside><main class="main"><div id="nearCrumb" class="crumb"></div><div id="nearContent"></div><div id="nearActions" class="actions"></div></main></div></section>
<section id="far" class="screen hidden"><div class="workspace"><aside id="farNav" class="nav"></aside><main class="main"><div id="farCrumb" class="crumb"></div><div id="farContent"></div><div id="farActions" class="actions"></div></main></div></section>
<section id="done" class="screen hidden"><div style="width:100%"><div id="doneEy" class="ey"></div><h1 id="doneTitle" style="font-size:clamp(40px,6vw,58px)"></h1><p id="doneLead" class="lead"></p><div class="summary"><div class="card"><div class="ey">RAW TRAJECTORY</div><div id="trace" class="trace" style="margin-top:12px"></div></div><div class="card"><div class="ey">JOURNEY</div><div id="shape"></div><div id="research" class="research hidden"></div></div></div><div class="row"><button id="export" class="primary"></button><button id="again" class="btn"></button></div></div></section>
</div><script>
const $=id=>document.getElementById(id);const packs=window.PAJ_PF02_PACKS;const q=new URLSearchParams(location.search);const dev=q.get('dev')==='1';let locale=q.get('locale')&&packs[q.get('locale')]?q.get('locale'):'zh-CN';let P=packs[locale];const S={started:0,events:[],views:{seed:[],near:[],far:[]},detail:{seed:[],near:[],far:[]},action:{seed:null,near:null,far:null},view:{seed:0,near:0,far:0}};const now=()=>Math.round(performance.now()-S.started);const log=(type,data={})=>S.events.push({seq:S.events.length+1,t_ms:now(),type,...data});function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));$(id).classList.remove('hidden');scrollTo(0,0)}function active(el,i){el.querySelectorAll('button[data-i]').forEach(b=>b.classList.toggle('active',Number(b.dataset.i)===i))}function markView(world,i){const k='nav_'+i;if(!S.views[world].includes(k))S.views[world].push(k);log('open_object',{world,object:k})}function markDetail(world,key){if(!S.detail[world].includes(key))S.detail[world].push(key);log('open_detail',{world,object:key})}function metrics(rows){return `<div class="metricGrid">${rows.map(r=>`<div class="card metric"><span class="meta">${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>`}function spark(v=[85,86,84,87,85,72,68]){return `<div class="spark">${v.map(x=>`<i style="height:${x}%"></i>`).join('')}</div>`}function table(head,rows,detailClass=''){return `<table class="table"><tr>${head.map(x=>`<th>${x}</th>`).join('')}${detailClass?'<th></th>':''}</tr>${rows.map((r,i)=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}${detailClass?`<td><button class="link ${detailClass}" data-j="${i}">${P.seed.open}</button></td>`:''}</tr>`).join('')}</table>`}function logBox(rows){return `<div class="log">${rows.map(x=>`<div>${x}</div>`).join('')}</div>`}
function applyPack(){P=packs[locale];document.documentElement.lang=locale;$('market').textContent=P.market;$('introEy').textContent=P.intro.ey;$('introTitle').textContent=P.intro.title;$('introLead').textContent=P.intro.lead;$('start').textContent=P.intro.start;$('introHelp').textContent=P.intro.help;$('cueEy').textContent=P.cue.ey;$('cueLine').textContent=P.cue.line;$('cueNext').textContent=P.cue.next;$('seedCrumb').textContent=P.seed.crumb;$('nearCrumb').textContent=P.near.crumb;$('farCrumb').textContent=P.far.crumb;$('doneEy').textContent=P.done.ey;$('doneTitle').textContent=P.done.title;$('doneLead').textContent=P.done.lead;$('export').textContent=P.done.export;$('again').textContent=P.done.again;renderNav('seed');renderNav('near');renderNav('far')}
function renderNav(world){const w=P[world],el=$(world+'Nav');el.innerHTML=`<div class="brand">${w.brand}</div>`+w.nav.map((n,i)=>`<button data-i="${i}">${n}</button>`).join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>renderWorld(world,Number(b.dataset.i),true));active(el,S.view[world])}
function startJourney(){S.started=performance.now();S.events=[];S.views={seed:[],near:[],far:[]};S.detail={seed:[],near:[],far:[]};S.action={seed:null,near:null,far:null};S.view={seed:0,near:0,far:0};log('session_start',{locale,market:P.market});show('seed');renderWorld('seed',0,true)}
function renderWorld(world,i,track=false){S.view[world]=i;if(track)markView(world,i);active($(world+'Nav'),i);if(world==='seed')renderSeed(i);if(world==='near')renderNear(i);if(world==='far')renderFar(i);renderActions(world)}
function renderSeed(i){const w=P.seed,c=$('seedContent');if(i===0)c.innerHTML=`<h2>${w.title}</h2><p class="lead">${w.status}</p>${metrics(w.metrics)}${spark()}`;if(i===1)c.innerHTML=`<h2>${w.nav[1]}</h2><div class="card">${table(w.sliceCols,w.slices,'seedSlice')}</div><div id="seedDetail"></div>`;if(i===2)c.innerHTML=`<h2>${w.nav[2]}</h2><div class="card"><div class="object"><span>expected</span><b>${w.generation.expected}</b></div><div class="object"><span>A</span><b>${w.generation.a}</b></div><div class="object"><span>B</span><b>${w.generation.b}</b></div><button id="compareGen" class="btn">${w.generation.compare}</button><div id="genDetail"></div></div>`;if(i===3)c.innerHTML=`<h2>${w.nav[3]}</h2><div class="card">${table(['',''],w.corpus)}</div>`;if(i===4)c.innerHTML=`<h2>${w.nav[4]}</h2>${logBox(w.releases)}`;if(i===5)c.innerHTML=`<h2>${w.nav[5]}</h2><div class="card">${table(['','',''],w.requests,'seedReq')}</div><div id="seedDetail"></div>`;document.querySelectorAll('.seedSlice').forEach(b=>b.onclick=()=>{const j=Number(b.dataset.j);markDetail('seed','slice_'+j);$('seedDetail').innerHTML=`<div class="notice">${w.slices[j][0]} · ${w.slices[j][1]} · ${w.slices[j][2]}</div>`});document.querySelectorAll('.seedReq').forEach(b=>b.onclick=()=>{const j=Number(b.dataset.j);markDetail('seed','request_'+j);$('seedDetail').innerHTML=`<div class="notice">${w.requests[j].join(' · ')}</div>`});if($('compareGen'))$('compareGen').onclick=()=>{markDetail('seed','serving_generation_compare');$('genDetail').innerHTML=`<div class="notice"><b>${w.generation.traffic}</b><p>${w.generation.detail}</p></div>`}}
function renderNear(i){const w=P.near,c=$('nearContent');if(i===0)c.innerHTML=`<h2>${w.title}</h2><p class="lead">${w.status}</p>${metrics(w.metrics)}${spark([83,84,85,84,82,72,69])}`;if(i===1)c.innerHTML=`<h2>${w.nav[1]}</h2><div class="card">${table(['',''],w.depots,'nearScan')}</div><div id="nearDetail"></div>`;if(i===2)c.innerHTML=`<h2>${w.nav[2]}</h2><div class="card">${table(['',''],w.carriers)}</div>`;if(i===3)c.innerHTML=`<h2>${w.nav[3]}</h2><div class="panel">${w.routes}</div>`;if(i===4)c.innerHTML=`<h2>${w.nav[4]}</h2><div class="panel">${w.weather}</div>`;if(i===5)c.innerHTML=`<h2>${w.nav[5]}</h2><div class="card">${table(['','',''],w.cities,'nearCity')}</div><div id="nearDetail"></div>`;document.querySelectorAll('.nearScan').forEach(b=>b.onclick=()=>{const j=Number(b.dataset.j);markDetail('near','scan_'+j);$('nearDetail').innerHTML=`<div class="notice">${w.nested.scan}: ${w.depots[j].join(' · ')}</div>`});document.querySelectorAll('.nearCity').forEach(b=>b.onclick=()=>{const j=Number(b.dataset.j);markDetail('near','city_'+j);$('nearDetail').innerHTML=`<div class="notice">${w.nested.city}: ${w.cities[j].join(' · ')}</div>`})}
function renderFar(i){const w=P.far,c=$('farContent');if(i===0)c.innerHTML=`<h2>${w.title}</h2><p class="lead">${w.status}</p>${metrics(w.metrics)}${spark([60,62,61,63,67,72,78])}<button id="interval" class="btn">${w.nested.interval}</button><div id="farDetail"></div>`;if(i===1)c.innerHTML=`<h2>${w.nav[1]}</h2><div class="panel">${w.weather}</div>`;if(i===2)c.innerHTML=`<h2>${w.nav[2]}</h2><div class="card">${table(['',''],w.schedules,'farRoom')}</div><div id="farDetail"></div>`;if(i===3)c.innerHTML=`<h2>${w.nav[3]}</h2><div class="panel">${w.firmware}</div>`;if(i===4)c.innerHTML=`<h2>${w.nav[4]}</h2><div class="panel">${w.occupancy}</div>`;if(i===5)c.innerHTML=`<h2>${w.nav[5]}</h2><div class="panel">${w.tariff}</div>`;if($('interval'))$('interval').onclick=()=>{markDetail('far','interval_15m');$('farDetail').innerHTML=`<div class="notice">00:00 1.0 · 00:15 1.1 · 00:30 1.2 · 00:45 1.2 · 01:00 1.3</div>`};document.querySelectorAll('.farRoom').forEach(b=>b.onclick=()=>{const j=Number(b.dataset.j);markDetail('far','room_'+j);$('farDetail').innerHTML=`<div class="notice">${w.nested.room}: ${w.schedules[j].join(' · ')}</div>`})}
function renderActions(world){const w=P[world],el=$(world+'Actions'),a=S.action[world];if(!a){const firstKey=world==='far'?'revert':'rollback',secondKey=world==='seed'?'repin':world==='near'?'reroute':'schedule';el.innerHTML=`<h3>${w.actions.title}</h3><div class="row"><button class="primary worldAction" data-a="${firstKey}">${w.actions[firstKey]}</button><button class="btn worldAction" data-a="${secondKey}">${w.actions[secondKey]}</button><button class="btn worldAction" data-a="hold">${w.actions.hold}</button></div>`;el.querySelectorAll('.worldAction').forEach(b=>b.onclick=()=>takeAction(world,b.dataset.a));return}const text=w.consequence[a],post=w.post;el.innerHTML=`<div class="notice"><b>${text}</b></div><div class="row"><button class="btn inspectCurrent">${post.inspect}</button><button class="btn switchAction">${post.switch}</button><button class="primary commitWorld">${post.commit}</button></div>`;const ins=el.querySelector('.inspectCurrent'),sw=el.querySelector('.switchAction'),co=el.querySelector('.commitWorld');ins.onclick=()=>{log('post_consequence_action',{world,action:'inspect_more',after:a});const target=world==='seed'?2:world==='near'?5:0;renderWorld(world,target,true)};sw.onclick=()=>{log('post_consequence_action',{world,action:'switch_mitigation',from:a});S.action[world]=null;renderActions(world)};co.onclick=()=>commitWorld(world)}
function takeAction(world,a){S.action[world]=a;log('provisional_action',{world,action:a});log('post_action_check',{world,action:a,outcome:'partial'});renderActions(world)}
function commitWorld(world){log('commit',{world,action:S.action[world],views:[...S.views[world]],details:[...S.detail[world]]});if(world==='seed'){show('cue');return}if(world==='near'){show('far');renderWorld('far',0,true);return}finish()}
function finish(){log('session_complete',{market:P.market});$('trace').innerHTML=S.events.filter(e=>e.type!=='session_start').map(e=>`<div>#${e.seq} · ${e.t_ms}ms · ${e.type} · ${e.world||'journey'}${e.object?' / '+e.object:''}${e.action?' / '+e.action:''}</div>`).join('');const d=S.events.filter(e=>e.type==='open_detail').length,r=S.events.filter(e=>e.type==='post_consequence_action'&&e.action==='switch_mitigation').length;$('shape').innerHTML=`<div class="card"><span class="meta">${P.seed.brand}</span><div class="count">${S.detail.seed.length}</div></div><div class="card"><span class="meta">${P.near.brand}</span><div class="count">${S.detail.near.length}</div></div><div class="card"><span class="meta">${P.far.brand}</span><div class="count">${S.detail.far.length}</div></div><div class="row"><span class="pill">nested detail ${d}</span><span class="pill">revisions ${r}</span></div>`;if(dev){$('research').classList.remove('hidden');$('research').innerHTML='<b>Research view</b><p>Seed incident → partial consequence → one structural sentence → fulfillment transfer → energy transfer. No participant-facing cause label or score is used.</p>'}show('done')}
function exportTrace(){const payload={instrument:'golden-pf02-v1',locale,market:P.market,events:S.events,views:S.views,details:S.detail,actions:S.action};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=`paj-pf02-${P.market}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
Object.entries(packs).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v.native;$('locale').appendChild(o)});$('locale').value=locale;$('locale').onchange=e=>{locale=e.target.value;P=packs[locale];history.replaceState(null,'',`?locale=${encodeURIComponent(locale)}${dev?'&dev=1':''}`);S.view={seed:0,near:0,far:0};applyPack();show('intro')};$('start').onclick=startJourney;$('cueNext').onclick=()=>{log('minimal_intervention',{dose:'one_sentence'});show('near');renderWorld('near',0,true)};$('export').onclick=exportTrace;$('again').onclick=()=>location.reload();applyPack();
</script></body></html>
