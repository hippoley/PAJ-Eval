<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive Task</title>
<style>
:root{--bg:#f1efe8;--paper:#fffefa;--ink:#18191d;--muted:#72767f;--line:#ddd9cf;--soft:#f7f4ed;--dark:#202227;--warm:#b85a3e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,"Noto Sans",system-ui,sans-serif}.app{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:5px 0 14px;font:11px ui-monospace,monospace;letter-spacing:.1em;color:var(--muted)}select,button{font:inherit}.screen{min-height:83vh;display:flex;align-items:center}.hidden{display:none!important}.hero{max-width:820px}.ey{font:11px ui-monospace,monospace;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(44px,7vw,76px);line-height:.99;letter-spacing:-.05em;margin:10px 0 22px}h2{font-size:30px;letter-spacing:-.03em;margin:4px 0 8px}.lead{font-size:19px;color:#454951;max-width:820px}.help,.meta{font-size:13px;color:var(--muted)}.btn,.primary{border-radius:10px;padding:10px 13px;cursor:pointer}.btn{border:1px solid var(--line);background:#fff}.primary{border:0;background:var(--dark);color:#fff;font-weight:700}.link{border:0;background:transparent;text-decoration:underline;cursor:pointer;padding:4px;color:inherit}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:12px}.workspace{width:100%;display:grid;grid-template-columns:225px minmax(0,1fr);min-height:690px;background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 18px 55px #2a271f10}.nav{padding:17px;background:var(--soft);border-right:1px solid var(--line)}.nav .brand{font:11px ui-monospace,monospace;color:var(--muted);margin-bottom:12px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:10px;margin:3px 0;cursor:pointer;color:#3e424a}.nav button.active,.nav button:hover{background:#e9e5da;color:#111}.main{padding:25px;min-width:0}.crumb{font:11px ui-monospace,monospace;color:var(--muted);margin-bottom:17px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:14px 0}.card{border:1px solid var(--line);border-radius:15px;background:#fff;padding:16px}.price{font-size:27px;font-weight:800;letter-spacing:-.03em;margin:8px 0}.object{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.object:last-child{border-bottom:0}.notice{border-left:3px solid var(--warm);background:#fff7ed;padding:13px 15px;margin:14px 0}.actions{border-top:1px solid var(--line);margin-top:24px;padding-top:16px}.actions h3{margin:0 0 10px}.spark{height:82px;display:flex;gap:6px;align-items:flex-end;margin:14px 0}.spark i{flex:1;background:#d8d3c9;border-radius:5px 5px 2px 2px}.spark i:last-child{background:#c88771}.moment{max-width:760px;margin:auto;text-align:center}.moment p{font:30px/1.35 Georgia,"Songti SC",serif;color:var(--warm)}.progress{display:flex;gap:7px;margin-top:18px}.progress span{height:7px;flex:1;border-radius:99px;background:#ddd8ce}.progress span.on{background:var(--dark)}.summary{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;width:100%}.trace{background:var(--dark);color:#eee;border-radius:13px;padding:13px;font:12px ui-monospace,monospace;max-height:430px;overflow:auto}.trace div{padding:6px 0;border-bottom:1px solid #3a3d44}.count{font-size:32px;font-weight:800}.research{border-left:3px solid var(--warm);background:#fff7ed;padding:14px;margin-top:13px}@media(max-width:800px){.workspace{grid-template-columns:1fr}.nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.nav .brand{display:none}.nav button{min-width:145px;width:auto;white-space:nowrap}.metrics,.summary{grid-template-columns:1fr}.main{padding:18px}.screen{min-height:88vh}.moment p{font-size:24px}}
</style><script src="pf04-packs.js"></script><link rel="stylesheet" href="premium-system.css"></head>
<body><div class="journeyShellBar"><a href="stage.html" class="journeyShellHome">PAJ-EVAL</a><span class="journeyShellIndex">JOURNEY 04 / 08</span><a href="stage.html" class="journeyShellBack">All journeys ↗</a></div><div class="app"><header class="top"><div><span id="market"></span> <select id="locale"></select></div></header>
<section id="intro" class="screen"><div class="hero"><div id="introEy" class="ey"></div><h1 id="introTitle"></h1><p id="introLead" class="lead"></p><button id="start" class="primary"></button><p id="introHelp" class="help"></p><div class="progress"><span class="on"></span><span></span><span></span><span></span></div></div></section>
<section id="seed" class="screen hidden"><div class="workspace"><aside id="seedNav" class="nav"></aside><main class="main"><div id="seedCrumb" class="crumb"></div><div id="seedContent"></div><div id="seedActions" class="actions"></div></main></div></section>
<section id="cue" class="screen hidden"><div class="moment"><div id="cueEy" class="ey"></div><p id="cueLine"></p><button id="cueNext" class="primary"></button><div class="progress"><span class="on"></span><span class="on"></span><span></span><span></span></div></div></section>
<section id="near" class="screen hidden"><div class="workspace"><aside id="nearNav" class="nav"></aside><main class="main"><div id="nearCrumb" class="crumb"></div><div id="nearContent"></div><div id="nearActions" class="actions"></div></main></div></section>
<section id="far" class="screen hidden"><div class="workspace"><aside id="farNav" class="nav"></aside><main class="main"><div id="farCrumb" class="crumb"></div><div id="farContent"></div><div id="farActions" class="actions"></div></main></div></section>
<section id="done" class="screen hidden"><div style="width:100%"><div id="doneEy" class="ey"></div><h1 id="doneTitle" style="font-size:clamp(40px,6vw,58px)"></h1><p id="doneLead" class="lead"></p><div class="summary"><div class="card"><div id="trace" class="trace"></div></div><div><div id="shape" class="summary" style="grid-template-columns:1fr"></div><div id="research" class="research hidden"></div></div></div><div class="row"><button id="export" class="primary"></button><button id="again" class="btn"></button></div></div></section>
</div><script src="golden-study-bridge.js"></script>
<script src="pf04-player.js"></script></body></html>
