<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAJ-Eval · Probe Player v4.1</title>
<style>
:root{--bg:#eeece5;--paper:#fffefa;--ink:#17181c;--muted:#737780;--line:#dcd8ce;--hot:#b9583d;--dark:#1d1f24;--ok:#2f7154;--warn:#9a681e;--bad:#9b3e2c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,sans-serif}.wrap{max-width:1160px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0 22px;font:11px ui-monospace,monospace;letter-spacing:.08em;color:var(--muted)}.topRight,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge,.status{display:inline-flex;gap:7px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:#fff9;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}select,button,input{font:inherit}.hero{padding:5vh 0 2vh}h1{font-size:clamp(45px,7vw,78px);line-height:.97;letter-spacing:-.055em;margin:12px 0 20px;max-width:920px}h2{font-size:30px;letter-spacing:-.03em;margin:8px 0}.lead{font-size:20px;color:#42464e;max-width:820px}.muted{color:var(--muted)}.tiny{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:28px 0}.world{min-height:190px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:17px;cursor:pointer;transition:.16s}.world:hover{transform:translateY(-3px);box-shadow:0 16px 40px #29251c14}.id{font:11px ui-monospace,monospace;color:var(--hot)}.world b{display:block;font-size:18px;margin:10px 0}.panel,.card{background:var(--paper);border:1px solid var(--line);border-radius:20px}.panel{overflow:hidden;box-shadow:0 20px 60px #29251c12}.playhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.body{display:grid;grid-template-columns:1.05fr .95fr;min-height:520px}.story{padding:30px}.objects{padding:22px;background:#f7f4ed;border-left:1px solid var(--line)}.obj,.choice,.ghost,.primary{cursor:pointer;border-radius:12px;padding:12px 14px}.obj,.choice,.ghost{border:1px solid var(--line);background:white}.obj{width:100%;text-align:left;margin:5px 0}.obj b{display:block}.obj small{color:var(--muted)}.obj:disabled{opacity:.48}.choices{display:grid;gap:8px;margin-top:20px}.choice{text-align:left}.primary{border:0;background:var(--dark);color:white}.reveal{border-left:3px solid var(--hot);padding:13px 15px;background:#fff6ed;margin:18px 0}.mode{padding:13px 15px;border:1px solid var(--line);background:#f8f6ef;border-radius:12px;max-width:840px}.mode label{margin-right:18px}.consent{display:flex;gap:8px;align-items:flex-start;max-width:840px;margin:16px 0;color:var(--muted)}.hidden{display:none!important}.done{padding:28px;margin:5vh auto;max-width:900px}.trace{background:var(--dark);color:#eee;border-radius:14px;padding:14px;font:12px ui-monospace,monospace;max-height:300px;overflow:auto;margin:18px 0}.trace div{padding:6px 0;border-bottom:1px solid #35383f}.status.ok{background:#e8f0ea;color:var(--ok)}.status.warn{background:#fff4dd;color:var(--warn)}.status.bad{background:#fee8e3;color:var(--bad)}.links a{color:inherit}.footer{padding:30px 0;color:var(--muted);font-size:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.body{grid-template-columns:1fr}.objects{border-left:0;border-top:1px solid var(--line)}}@media(max-width:500px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}h1{font-size:48px}}
</style>
<script src="locales.js"></script><script src="transport.js"></script></head>
<body><main class="wrap">
<header class="top"><b>PAJ-EVAL / PROBE PLAYER / V4.1</b><div class="topRight"><select id="locale"></select><span class="badge"><i class="dot" id="dot"></i><span id="net">CONNECTED</span></span></div></header>
<section id="home"><div class="hero"><div class="id">PLAYABLE JUDGMENT INSTRUMENT</div><h1 id="homeTitle"></h1><p class="lead" id="homeLead"></p><p class="muted" id="privacy"></p><label class="consent"><input id="consent" type="checkbox"><span id="consentText"></span></label><div class="mode"><label><input type="radio" name="mode" value="server" checked> <span id="serverMode"></span></label><label><input type="radio" name="mode" value="local"> <span id="localMode"></span></label><div class="tiny" id="queueInfo"></div></div></div><div class="grid" id="grid"></div><div class="links tiny"><a href="research.html">Research Session Browser</a></div></section>
<section id="player" class="hidden"><div class="panel"><div class="playhead"><div><span class="id" id="pid"></span> · <span id="pname"></span></div><button class="ghost" id="backBtn">← Probe library</button></div><div class="body"><div class="story"><div class="id">SITUATION</div><h2 id="title"></h2><p class="lead" id="situation"></p><div id="reveal" class="reveal hidden"></div><div class="id" id="readyLabel"></div><div class="choices" id="choices"></div></div><aside class="objects"><div class="id" id="objectsLabel"></div><p class="muted" id="objectsHint"></p><div id="objects"></div></aside></div></div></section>
<section id="done" class="card done hidden"><span class="status" id="saveStatus">LOCAL ONLY</span><h2 id="doneTitle"></h2><p class="lead" id="result"></p><p class="muted" id="trajectoryNote"></p><div class="trace" id="trace"></div><div class="row"><button class="primary" id="againBtn"></button><button class="ghost" id="exportBtn"></button></div></section>
<footer class="footer">Raw events are evidence; derived features and evaluations remain versioned, replaceable layers.</footer>
</main>
<script>
const ENDPOINT='https://pwdcgfvarudhqezlzwmx.supabase.co/functions/v1/ingest-probe';
const $=id=>document.getElementById(id);let locale='en',current=null,t0=0,events=[],committed=false,lastPayload=null;
const transport=PAJTransport.createBrowserTransport(ENDPOINT);
const chrome={
'en':{consent:'I consent to pseudonymous research trajectory storage for instrument development.',server:'Research server + offline retry',local:'Local only',hint:'Open what you would naturally inspect. There is no required item.',done:'Raw trajectory captured.',export:'Export raw trace'},
'zh-CN':{consent:'我同意将本次匿名化交互轨迹用于研究仪器开发。',server:'研究服务器 + 离线重试',local:'仅本机保存',hint:'打开你自然会查看的东西；没有必查项。',done:'原始轨迹已捕获。',export:'导出原始轨迹'},
'zh-TW':{consent:'我同意將本次匿名化互動軌跡用於研究儀器開發。',server:'研究伺服器 + 離線重試',local:'僅本機保存',hint:'開啟你自然會查看的東西；沒有必查項。',done:'原始軌跡已擷取。',export:'匯出原始軌跡'},
ja:{consent:'研究機器の開発のため、匿名化された操作軌跡の保存に同意します。',server:'研究サーバー + オフライン再試行',local:'ローカルのみ',hint:'自然に確認したいものを開いてください。必須項目はありません。',done:'生の操作軌跡を記録しました。',export:'生の軌跡を書き出す'},
ko:{consent:'연구 도구 개발을 위해 익명화된 상호작용 궤적 저장에 동의합니다.',server:'연구 서버 + 오프라인 재시도',local:'로컬에만 저장',hint:'자연스럽게 확인하고 싶은 항목을 여세요. 필수 항목은 없습니다.',done:'원시 궤적을 기록했습니다.',export:'원시 궤적 내보내기'},
es:{consent:'Consiento el almacenamiento seudónimo de la trayectoria para desarrollar el instrumento.',server:'Servidor de investigación + reintento sin conexión',local:'Solo local',hint:'Abre lo que inspeccionarías de forma natural. No hay elementos obligatorios.',done:'Trayectoria bruta capturada.',export:'Exportar trayectoria'},
fr:{consent:'J’accepte le stockage pseudonymisé de cette trajectoire pour développer l’instrument.',server:'Serveur de recherche + reprise hors ligne',local:'Local uniquement',hint:'Ouvrez ce que vous consulteriez naturellement. Aucun élément n’est obligatoire.',done:'Trajectoire brute enregistrée.',export:'Exporter la trajectoire'},
de:{consent:'Ich stimme der pseudonymen Speicherung dieser Interaktionsspur zur Instrumententwicklung zu.',server:'Forschungsserver + Offline-Wiederholung',local:'Nur lokal',hint:'Öffnen Sie, was Sie natürlich prüfen würden. Nichts ist verpflichtend.',done:'Rohtrajektorie erfasst.',export:'Rohtrajektorie exportieren'},
pt:{consent:'Concordo com o armazenamento pseudônimo da trajetória para desenvolver o instrumento.',server:'Servidor de pesquisa + nova tentativa offline',local:'Somente local',hint:'Abra o que você naturalmente inspecionaria. Nenhum item é obrigatório.',done:'Trajetória bruta capturada.',export:'Exportar trajetória'},
ru:{consent:'Я согласен на псевдонимное хранение траектории для разработки инструмента.',server:'Исследовательский сервер + офлайн-повтор',local:'Только локально',hint:'Открывайте то, что вы бы естественно проверили. Обязательных пунктов нет.',done:'Сырая траектория сохранена.',export:'Экспортировать траекторию'}};
function L(){return PAJ_LOCALES[locale]}function C(){return chrome[locale]||chrome.en}
function splitObject(s){const i=s.indexOf('|');return i<0?[s,'']:[s.slice(0,i),s.slice(i+1)]}
function setNet(kind,text){$('net').textContent=text;$('dot').className='dot'+(kind==='warn'?' warn':kind==='bad'?' bad':'')}
function log(event,target,extra={}){events.push({seq:events.length+1,event,target,t:Date.now()-t0,locale,screen:current&&current.id,...extra})}
async function refreshPending(){try{const n=await transport.pending();$('queueInfo').textContent=n?`${n} pending submission(s) on this device.`:''}catch{$('queueInfo').textContent='Local durable queue unavailable in this browser.'}}
function renderLocale(){const x=L(),c=C();document.documentElement.lang=locale;document.body.style.fontFamily=x.font;$('homeTitle').textContent=x.ui.homeTitle;$('homeLead').textContent=x.ui.homeLead;$('privacy').textContent=x.ui.privacy;$('objectsLabel').textContent=x.ui.objects;$('readyLabel').textContent=x.ui.ready;$('backBtn').textContent='← '+x.ui.library;$('trajectoryNote').textContent=x.ui.trajectory;$('againBtn').textContent=x.ui.again;$('consentText').textContent=c.consent;$('serverMode').textContent=c.server;$('localMode').textContent=c.local;$('objectsHint').textContent=c.hint;$('doneTitle').textContent=c.done;$('exportBtn').textContent=c.export;renderGrid()}
function renderGrid(){$('grid').innerHTML='';Object.entries(L().pf).forEach(([id,p])=>{const d=document.createElement('article');d.className='world';d.innerHTML=`<span class="id">${id}</span><b>${p[0]}</b><p class="muted">${p[1]}</p>`;d.onclick=()=>openWorld(id);$('grid').appendChild(d)})}
function show(name){['home','player','done'].forEach(x=>$(x).classList.toggle('hidden',x!==name));scrollTo(0,0)}
function openWorld(id){if(!$('consent').checked){$('consent').focus();return}const p=L().pf[id];current={id,p};events=[];committed=false;lastPayload=null;t0=Date.now();log('probe_started',id,{phase:'start'});$('pid').textContent=id;$('pname').textContent=p[0];$('title').textContent=p[0];$('situation').textContent=p[2];$('reveal').classList.add('hidden');$('objects').innerHTML='';$('choices').innerHTML='';p[3].forEach((raw,j)=>{const [name,desc]=splitObject(raw),b=document.createElement('button');b.className='obj';b.innerHTML=`<b>${name}</b><small>${desc}</small>`;b.onclick=()=>{if(b.disabled)return;log('inspect','object_'+j,{phase:'evidence'});b.disabled=true;$('reveal').textContent=p[4];$('reveal').classList.remove('hidden')};$('objects').appendChild(b)});p[5].forEach((c,j)=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>finish(j,c);$('choices').appendChild(b)});show('player')}
async function finish(i,label){if(committed)return;committed=true;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);log('commit','choice_'+i,{phase:'decision'});$('result').textContent=label;$('trace').innerHTML=events.map(e=>`<div>#${e.seq} · ${e.t}ms · ${e.event} · ${e.target}</div>`).join('');show('done');const payload={client_submission_id:crypto.randomUUID(),locale,instrument_version:'probe-player-v4.1',probe_family:current.id,world_variant:'localized_01',terminal_action:'choice_'+i,events:events.map(e=>({event:e.event,target:e.target,t:e.t,locale:e.locale,screen:e.screen,seq:e.seq,phase:e.phase}))};lastPayload=payload;const localOnly=document.querySelector('input[name=mode]:checked').value==='local';if(localOnly){localStorage.setItem('paj_local_trace',JSON.stringify(payload));setSave('warn',L().ui.local);return}setSave('',L().ui.saving);const r=await transport.submit(payload);if(r.state==='saved'){setSave('ok',L().ui.saved+' · '+r.session_id.slice(0,8));localStorage.setItem('paj_last_session',r.session_id);setNet('ok','CONNECTED')}else{setSave('warn',L().ui.failed+' · '+L().ui.queued);setNet('warn','OFFLINE QUEUE')}await refreshPending()}
function setSave(kind,text){$('saveStatus').className='status '+kind;$('saveStatus').textContent=text}
async function retry(){if(!navigator.onLine)return;try{const out=await transport.retryAll();if(out.some(x=>x.state!=='saved'))setNet('warn','OFFLINE QUEUE');else setNet('ok','CONNECTED');await refreshPending()}catch{setNet('warn','OFFLINE QUEUE')}}
function exportTrace(){if(!lastPayload)return;const blob=new Blob([JSON.stringify(lastPayload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`paj-${current.id}-${lastPayload.client_submission_id}.json`;a.click();URL.revokeObjectURL(a.href)}
Object.entries(PAJ_LOCALES).forEach(([code,x])=>{const o=document.createElement('option');o.value=code;o.textContent=x.native;$('locale').appendChild(o)});$('locale').value=locale;$('locale').onchange=e=>{locale=e.target.value;renderLocale()};$('backBtn').onclick=()=>show('home');$('againBtn').onclick=()=>show('home');$('exportBtn').onclick=exportTrace;window.addEventListener('online',retry);window.addEventListener('load',()=>{renderLocale();refreshPending();retry()});
</script></body></html>
