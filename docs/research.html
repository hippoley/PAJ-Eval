<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAJ-Eval · Research Session Browser</title><style>:root{--bg:#efede6;--paper:#fffefa;--ink:#18191d;--muted:#70747d;--line:#ddd9cf;--dark:#202227;--hot:#b85a3e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}h1{font-size:46px;letter-spacing:-.04em;margin:8px 0}h2{margin:0 0 12px}.muted{color:var(--muted)}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.login{max-width:650px}.row{display:flex;gap:8px;flex-wrap:wrap}input,button{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:white}input{flex:1;min-width:220px}button{cursor:pointer}.primary{background:var(--dark);color:white;border-color:var(--dark)}.layout{display:grid;grid-template-columns:330px 1fr;gap:14px}.sessions{max-height:70vh;overflow:auto}.session{padding:11px;border-bottom:1px solid var(--line);cursor:pointer}.session:hover{background:#f5f2ea}.session b{display:block}.trace{background:#1f2126;color:#eee;border-radius:12px;padding:12px;font:12px ui-monospace,monospace;max-height:420px;overflow:auto}.trace div{padding:6px;border-bottom:1px solid #363941}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eee;font-size:11px}.hidden{display:none}.error{color:#9b3e2c}@media(max-width:800px){.layout{grid-template-columns:1fr}.sessions{max-height:300px}}</style></head><body><main class="wrap"><div class="muted">PAJ-EVAL / RESEARCHER-ONLY</div><h1>Research Session Browser</h1><p class="muted">This page has no direct database access. It signs in through Supabase Auth and calls a JWT-protected Edge Function that requires <code>app_metadata.role = researcher</code>.</p><section id="login" class="card login"><h2>Researcher sign in</h2><div class="row"><input id="email" type="email" placeholder="researcher@example.com"><input id="password" type="password" placeholder="Password"><button class="primary" onclick="signIn()">Sign in</button></div><p id="authmsg" class="muted"></p></section><section id="browser" class="hidden"><div class="row"><button onclick="loadSessions()">Refresh sessions</button><button onclick="signOut()">Sign out</button><span id="who" class="muted"></span></div><div class="layout"><div class="card sessions" id="sessions"></div><div class="card" id="detail"><p class="muted">Select a session to replay its trajectory.</p></div></div></section></main><script>
const BASE='https://pwdcgfvarudhqezlzwmx.supabase.co';const KEY='sb_publishable_ALC8f3HsbaFTT0tpvi5Ikg_weLdi_S7';const API=BASE+'/functions/v1/research-sessions';let token=sessionStorage.getItem('paj_research_jwt')||'';
async function signIn(){authmsg.textContent='Signing in…';const r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({email:email.value,password:password.value})});const j=await r.json();if(!r.ok){authmsg.className='error';authmsg.textContent=j.error_description||j.msg||'Sign in failed';return}token=j.access_token;sessionStorage.setItem('paj_research_jwt',token);authmsg.className='muted';authmsg.textContent='Authenticated. Checking researcher role…';await enter()}
function signOut(){token='';sessionStorage.removeItem('paj_research_jwt');browser.classList.add('hidden');login.classList.remove('hidden')}
async function api(path=''){const r=await fetch(API+path,{headers:{Authorization:'Bearer '+token}});const j=await r.json();if(!r.ok)throw new Error(j.error||'request_failed');return j}
async function enter(){try{await loadSessions();login.classList.add('hidden');browser.classList.remove('hidden');who.textContent='Authenticated researcher'}catch(e){authmsg.className='error';authmsg.textContent=e.message==='researcher_role_required'?'Account is authenticated but lacks researcher role.':e.message}}
async function loadSessions(){const j=await api('?limit=100');sessions.innerHTML='';if(!j.sessions.length){sessions.innerHTML='<p class="muted">No sessions yet.</p>';return}j.sessions.forEach(s=>{const d=document.createElement('div');d.className='session';d.innerHTML=`<b>${s.session_id.slice(0,8)} · ${s.locale}</b><span class="muted">${new Date(s.created_at).toLocaleString()} · ${s.instrument_version}</span>`;d.onclick=()=>loadSession(s.session_id);sessions.appendChild(d)})}
async function loadSession(id){detail.innerHTML='<p class="muted">Loading…</p>';try{const j=await api('?session_id='+encodeURIComponent(id));const s=j.session,run=j.probe_runs[0]||{};detail.innerHTML=`<div class="row"><span class="pill">${s.locale}</span><span class="pill">${run.probe_family||'—'}</span><span class="pill">${s.instrument_version}</span></div><h2>${s.session_id}</h2><p class="muted">terminal: ${run.terminal_action||'—'} · status: ${s.status}</p><h3>Raw trajectory</h3><div class="trace">${j.events.map(e=>`<div>#${e.seq} · ${e.elapsed_ms}ms · ${e.event_type} · ${e.object_id||''}</div>`).join('')}</div><h3>Derived features</h3><pre>${esc(JSON.stringify(j.derived_features,null,2))}</pre><h3>Evaluations</h3><pre>${esc(JSON.stringify(j.evaluations,null,2))}</pre>`}catch(e){detail.innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
if(token)enter();
</script></body></html>
