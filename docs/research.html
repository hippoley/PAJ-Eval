<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAJ-Eval · Research Session Browser</title><style>:root{--bg:#efede6;--paper:#fffefa;--ink:#18191d;--muted:#70747d;--line:#ddd9cf;--dark:#202227;--hot:#b85a3e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}h1{font-size:46px;letter-spacing:-.04em;margin:8px 0}h2{margin:0 0 12px}h3{margin:18px 0 8px}.muted{color:var(--muted)}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.login{max-width:650px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,button{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:white}input{flex:1;min-width:220px}button{cursor:pointer}.primary{background:var(--dark);color:white;border-color:var(--dark)}.layout{display:grid;grid-template-columns:330px 1fr;gap:14px}.sessions{max-height:72vh;overflow:auto}.session{padding:11px;border-bottom:1px solid var(--line);cursor:pointer}.session:hover,.session.active{background:#f5f2ea}.session b{display:block}.trace{background:#1f2126;color:#eee;border-radius:12px;padding:12px;font:12px ui-monospace,monospace;max-height:420px;overflow:auto}.trace div{padding:6px;border-bottom:1px solid #363941}.trace details{border-bottom:1px solid #363941;padding:6px 0}.trace summary{cursor:pointer;list-style:none}.trace details pre{margin:8px 0 2px;padding:8px;background:#17191d;border-radius:8px;color:#cfd3dc}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eee;font-size:11px}.hidden{display:none}.error{color:#9b3e2c}pre{white-space:pre-wrap;overflow-wrap:anywhere}.empty{padding:18px;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.run{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.run:first-of-type{border-top:0;padding-top:0}.toolbar{margin:10px 0 14px}.toolbar input{min-width:300px}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}.metric{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#faf8f2}.metric b{display:block;font-size:18px}@media(max-width:800px){.layout{grid-template-columns:1fr}.sessions{max-height:300px}.summary{grid-template-columns:1fr}.toolbar input{min-width:0}}</style></head><body><main class="wrap"><div class="muted">PAJ-EVAL / RESEARCHER-ONLY</div><h1>Research Session Browser</h1><p class="muted">This page has no direct database access. It signs in through Supabase Auth and calls a JWT-protected Edge Function that requires <code>app_metadata.role = researcher</code>.</p><section id="login" class="card login"><h2>Researcher sign in</h2><div class="row"><input id="email" type="email" placeholder="researcher@example.com" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button class="primary" onclick="signIn()">Sign in</button></div><p id="authmsg" class="muted"></p></section><section id="browser" class="hidden"><div class="row"><button onclick="loadSessions()">Refresh sessions</button><button onclick="signOut()">Sign out</button><a href="index.html"><button>Open participant player</button></a><span id="who" class="muted"></span></div><div class="toolbar row"><input id="sessionId" placeholder="Open session ID…"><button onclick="openTypedSession()">Open</button></div><div class="layout"><div class="card sessions" id="sessions"></div><div class="card" id="detail"><p class="muted">Select a session to replay its trajectory.</p></div></div></section></main><script>
const BASE='https://pwdcgfvarudhqezlzwmx.supabase.co';const KEY='sb_publishable_ALC8f3HsbaFTT0tpvi5Ikg_weLdi_S7';const API=BASE+'/functions/v1/research-sessions';let token=sessionStorage.getItem('paj_research_jwt')||'',activeSession='';
const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function validUuid(s){return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(s||''))}
async function signIn(){$('authmsg').textContent='Signing in…';const r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({email:$('email').value,password:$('password').value})});const j=await r.json();if(!r.ok){$('authmsg').className='error';$('authmsg').textContent=j.error_description||j.msg||'Sign in failed';return}token=j.access_token;sessionStorage.setItem('paj_research_jwt',token);$('authmsg').className='muted';$('authmsg').textContent='Authenticated. Checking researcher role…';await enter()}
function signOut(){token='';activeSession='';sessionStorage.removeItem('paj_research_jwt');$('browser').classList.add('hidden');$('login').classList.remove('hidden');history.replaceState(null,'',location.pathname)}
async function api(path=''){const r=await fetch(API+path,{headers:{Authorization:'Bearer '+token}});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||('http_'+r.status));return j}
async function enter(){try{await loadSessions();$('login').classList.add('hidden');$('browser').classList.remove('hidden');$('who').textContent='Authenticated researcher';const wanted=new URL(location.href).searchParams.get('session_id');if(validUuid(wanted)){ $('sessionId').value=wanted; await loadSession(wanted)}}catch(e){$('authmsg').className='error';$('authmsg').textContent=e.message==='researcher_role_required'?'Account is authenticated but lacks researcher role.':e.message}}
async function loadSessions(){const j=await api('?limit=100');const rows=(j.sessions||[]).slice().sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));$('sessions').innerHTML='';if(!rows.length){$('sessions').innerHTML='<div class="empty">No sessions yet.</div>';return}rows.forEach(s=>{const d=document.createElement('div');d.className='session'+(s.session_id===activeSession?' active':'');d.dataset.sessionId=s.session_id;d.innerHTML=`<b>${esc(String(s.session_id).slice(0,8))} · ${esc(s.locale)}</b><span class="muted">${esc(new Date(s.created_at).toLocaleString())} · ${esc(s.instrument_version)} · ${esc(s.consent_version||'—')} · ${esc(s.client_schema_version||'—')}</span>`;d.onclick=()=>loadSession(s.session_id);$('sessions').appendChild(d)})}
function openTypedSession(){const id=$('sessionId').value.trim();if(!validUuid(id)){$('detail').innerHTML='<p class="error">Enter a valid session UUID.</p>';return}loadSession(id)}
function markActive(id){activeSession=id;document.querySelectorAll('.session').forEach(x=>x.classList.toggle('active',x.dataset.sessionId===id));$('sessionId').value=id;history.replaceState(null,'','?session_id='+encodeURIComponent(id))}
function renderRun(run,events,features,index){const trace=events.length?events.map(e=>`<details><summary>#${esc(e.seq)} · ${esc(e.elapsed_ms)}ms · ${esc(e.event_type)} · ${esc(e.object_id||'')}</summary><pre>${esc(JSON.stringify(e.payload_json||{},null,2))}</pre></details>`).join(''):'<div>No raw events returned for this run.</div>';return `<section class="run"><div class="row"><span class="pill">run ${index+1}</span><span class="pill">${esc(run.probe_family||'—')}</span><span class="pill">${esc(run.world_variant||'—')}</span><span class="pill">${events.length} events</span></div><p class="muted">terminal: ${esc(run.terminal_action||'—')} · probe_run_id: ${esc(run.probe_run_id||'—')}</p><div class="trace">${trace}</div><h3>Derived features for this run</h3><pre>${esc(JSON.stringify(features,null,2))}</pre></section>`}
async function loadSession(id){if(!validUuid(id)){$('detail').innerHTML='<p class="error">Invalid session id.</p>';return}$('detail').innerHTML='<p class="muted">Loading…</p>';try{const j=await api('?session_id='+encodeURIComponent(id)),s=j.session||{},runs=(j.probe_runs||[]).slice(),events=(j.events||[]).slice().sort((a,b)=>(a.seq??0)-(b.seq??0)),features=j.derived_features||[],evaluations=j.evaluations||[];const eventsByRun=new Map(),featuresByRun=new Map();for(const e of events){const k=e.probe_run_id||'';if(!eventsByRun.has(k))eventsByRun.set(k,[]);eventsByRun.get(k).push(e)}for(const f of features){const k=f.probe_run_id||'';if(!featuresByRun.has(k))featuresByRun.set(k,[]);featuresByRun.get(k).push(f)}const runsHtml=runs.length?runs.map((r,i)=>renderRun(r,eventsByRun.get(r.probe_run_id)||[],featuresByRun.get(r.probe_run_id)||[],i)).join(''):'<div class="empty">No probe runs returned for this session.</div>';const orphanEvents=events.filter(e=>!runs.some(r=>r.probe_run_id===e.probe_run_id));markActive(id);$('detail').innerHTML=`<div class="row"><span class="pill">${esc(s.locale)}</span><span class="pill">${esc(s.instrument_version)}</span><span class="pill">consent ${esc(s.consent_version||'—')}</span><span class="pill">${esc(s.status||'—')}</span></div><h2>${esc(s.session_id)}</h2><div class="summary"><div class="metric"><span class="muted">Probe runs</span><b>${runs.length}</b></div><div class="metric"><span class="muted">Raw events</span><b>${events.length}</b></div><div class="metric"><span class="muted">Evaluations</span><b>${evaluations.length}</b></div></div><h3>Run-by-run replay</h3>${runsHtml}${orphanEvents.length?`<div class="error">Warning: ${orphanEvents.length} event(s) are not attached to a returned probe run.</div>`:''}<h3>Session-level evaluations</h3><pre>${esc(JSON.stringify(evaluations,null,2))}</pre>`}catch(e){$('detail').innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
if(token)enter();
</script></body></html>
