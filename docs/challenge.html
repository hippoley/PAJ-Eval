<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,"Noto Sans","Noto Sans SC",system-ui,sans-serif}button,select,input{font:inherit}.app{max-width:1240px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:3px 3px 12px;font:11px ui-monospace,monospace;letter-spacing:.08em;color:var(--muted)}.top b{color:#3e3b36}.screen{min-height:760px;display:flex;align-items:center}.hidden{display:none!important}.hero{max-width:860px;padding-left:4vw}.ey,.mono{font:11px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(46px,7vw,78px);line-height:.98;letter-spacing:-.055em;margin:11px 0 22px}h2{font-size:31px;line-height:1.08;letter-spacing:-.04em;margin:3px 0 9px}.lead{font-size:20px;color:#484640;max-width:800px}.help,.meta,.sub{font-size:13px;color:var(--muted)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}.btn,.primary{min-height:42px;border-radius:10px;padding:9px 13px;cursor:pointer;transition:.14s transform,.14s background,.14s border-color}.btn{background:#fff;border:1px solid var(--line);color:#242424}.btn:hover{background:#f7f5f0;border-color:#c9c3b8}.primary{border:1px solid var(--dark);background:var(--dark);color:#fff;font-weight:720}.primary:hover{transform:translateY(-1px);background:#2a2a2a}.link{border:0;background:transparent;padding:5px 3px;color:#4a4741;text-decoration:underline;text-underline-offset:3px;cursor:pointer}.workspace{width:100%;display:grid;grid-template-columns:230px minmax(0,1fr);min-height:690px;background:var(--paper);border:1px solid #cbc5ba;border-radius:17px;overflow:hidden;box-shadow:var(--shadow)}.nav{padding:17px 12px;background:#efede6;border-right:1px solid var(--line)}.nav .brand{font:11px ui-monospace,monospace;letter-spacing:.07em;color:#4a4742;margin:1px 8px 14px}.nav button{display:flex;align-items:center;width:100%;min-height:42px;text-align:left;border:0;background:transparent;border-radius:9px;padding:9px 10px;margin:2px 0;cursor:pointer;color:#55514a}.nav button:before{content:"";width:7px;height:7px;border:1px solid #b5afa4;border-radius:50%;margin-right:9px}.nav button.active,.nav button:hover{background:#fff;color:#181818}.nav button.active:before{background:var(--warm);border-color:var(--warm)}.main{padding:28px 31px 32px;min-width:0;background:var(--paper)}.crumb{font:11px ui-monospace,monospace;letter-spacing:.03em;color:var(--muted);margin-bottom:22px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.card{border:1px solid var(--line);border-radius:14px;padding:17px;background:#fff}.price{font-size:32px;line-height:1;font-weight:780;margin:12px 0;letter-spacing:-.045em}.badge{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:12px;background:#fff}.object{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line)}.object:last-child{border-bottom:0}.panel{margin-top:13px;border:1px solid var(--line);border-radius:13px;padding:15px;background:#fff}.notice{border-left:3px solid var(--warm);padding:13px 15px;background:var(--warm2);margin:15px 0;border-radius:0 11px 11px 0}.good{border-left-color:var(--ok);background:var(--okbg)}.decisionbar{position:sticky;bottom:0;margin:25px -31px -32px;padding:24px 31px 24px;border-top:1px solid var(--line);background:linear-gradient(to bottom,rgba(251,250,246,.92),#fbfaf6 32%);backdrop-filter:blur(10px)}.moment{max-width:760px;margin:auto;text-align:center}.moment p{font:30px/1.4 Georgia,"Songti SC",serif}.moment .signal{color:var(--warm)}.summary{display:grid;grid-template-columns:1.08fr .92fr;gap:14px;width:100%}.trace{background:#1b1b1b;color:#eee;border-radius:13px;padding:15px;font:12px ui-monospace,monospace;max-height:420px;overflow:auto}.trace div{padding:7px 0;border-bottom:1px solid #343434}.research{border-left:3px solid var(--warm);background:var(--warm2);padding:15px;margin-top:13px}.progress{display:flex;gap:7px;align-items:center;margin-top:15px;max-width:520px}.progress span{height:6px;flex:1;border-radius:99px;background:#d8d3c9}.progress span.on{background:var(--dark)}.search{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:0}.search:focus{border-color:#9e978b;box-shadow:0 0 0 3px #ded9cf66}.localeNote{margin-top:10px;font-size:12px;color:var(--muted)}.nested{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.nested .card{padding:14px}.count{font-size:27px;font-weight:800;letter-spacing:-.04em}
.productGrid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:17px}.productCard{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#fff;padding:18px}.productVisual{height:150px;border-radius:12px;background:#f0eee8;display:grid;place-items:center;margin-bottom:17px;overflow:hidden}.hub{position:relative;width:115px;height:72px;border-radius:18px;background:#242424;box-shadow:0 11px 25px #0002}.hub:before{content:"";position:absolute;left:14px;right:14px;top:14px;height:2px;background:#555;border-radius:2px}.hub:after{content:"";position:absolute;right:15px;bottom:14px;width:8px;height:8px;border-radius:50%;background:#7fc49d}.hub.pro{width:126px;height:82px;border-radius:22px;background:#111}.hub.pro:after{background:#df7a55}.productTitle{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.productTitle b{font-size:18px}.quickFacts{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.fact{font-size:11px;color:#5d5951;border:1px solid var(--line);border-radius:999px;padding:4px 7px;background:#faf9f5}.productActions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}.cartHint{font-size:12px;color:var(--muted)}
.deviceList{margin-top:12px;border-top:1px solid var(--line)}.deviceRow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 3px;border-bottom:1px solid var(--line)}.deviceIcon{width:36px;height:36px;border-radius:11px;background:#ece9e2;display:grid;place-items:center;font-size:16px}.compat{font-size:11px;border-radius:999px;padding:4px 7px}.compat.direct{background:#edf7f1;color:#236447}.compat.bridge{background:#fff0e9;color:#9a4327}

.checkoutFlow{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;gap:8px;margin:14px 0}.checkoutNode{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff}.checkoutArrow{text-align:center;color:var(--muted);font-size:20px}.impactList{display:grid;gap:6px;margin-top:10px}.impactItem{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:9px;background:#f4f1ea}.mailList{border-top:1px solid var(--line);margin-top:10px}.mailRow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:center;padding:15px 2px;border-bottom:1px solid var(--line)}.mailDot{width:8px;height:8px;border-radius:50%;background:var(--warm)}.mailRow .subject{font-weight:680}.offerSheet{max-width:760px}.offerHeader{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:8px}.offerMeta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:13px}.offerMeta>div{padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff}.mapCompare{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mapCard{position:relative;height:190px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,#f0eee8,#e3e0d7);overflow:hidden;padding:14px}.mapCard:before,.mapCard:after{content:"";position:absolute;border:1px solid #c9c4b8;border-radius:50%;width:160px;height:160px;left:50%;top:50%;transform:translate(-50%,-50%)}.mapCard:after{width:90px;height:90px}.routeDot{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--warm);left:55%;top:44%}.travelGrid{display:grid;gap:9px;margin-top:14px}.flightRow{display:grid;grid-template-columns:92px minmax(0,1fr) 110px;gap:12px;align-items:center;border:1px solid var(--line);border-radius:13px;background:#fff;padding:14px}.flightTimes{font-size:19px;font-weight:750;letter-spacing:-.025em}.flightPrice{text-align:right;font-size:22px;font-weight:760}.timeline{margin-top:13px;border-left:2px solid #d1ccc1;padding-left:17px}.timeEvent{position:relative;padding:3px 0 18px}.timeEvent:before{content:"";position:absolute;left:-23px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--paper);border:2px solid var(--warm)}
@media(max-width:760px){.workspace{grid-template-columns:1fr}.nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:9px}.nav .brand{display:none}.nav button{min-width:140px;width:auto;white-space:nowrap}.main{padding:18px}.decisionbar{margin:24px -18px -18px;padding:21px 18px}.cards,.summary,.nested,.productGrid,.offerMeta,.mapCompare{grid-template-columns:1fr}.flightRow{grid-template-columns:1fr auto}.screen{min-height:720px}.moment p{font-size:25px}}
</style><script src="challenge-packs.js"></script><script src="challenge-depth.js"></script>\n<script src="golden-study-bridge.js"></script></head>
<body><div class="app"><header class="top"><b>PAJ-EVAL / GOLDEN CHALLENGE</b><div class="row" style="margin:0"><span id="market" class="badge"></span><select id="locale"></select></div></header>
<section id="intro" class="screen"><div class="hero"><div id="introEy" class="ey"></div><h1 id="introTitle"></h1><p id="introLead" class="lead"></p><button id="startBtn" class="primary"></button><p id="introHelp" class="help"></p><div class="progress"><span class="on"></span><span></span><span></span><span></span><span></span></div><div id="localeNote" class="localeNote"></div></div></section>
<section id="shop" class="screen hidden"><div class="workspace"><aside class="nav" id="shopNav"></aside><main class="main"><div id="shopCrumb" class="crumb"></div><div id="shopContent"></div></main></div></section>
<section id="checkout" class="screen hidden"><div class="workspace"><aside class="nav"><div class="brand" id="checkoutBrand"></div><button class="active" id="checkoutNav"></button><button id="checkoutBack"></button><button id="checkoutDevices"></button></aside><main class="main"><div id="checkoutCrumb" class="crumb"></div><h2 id="extraTitle"></h2><div id="checkoutCard" class="card"></div><div id="consequence" class="notice"></div><div id="checkoutDetail"></div><div id="checkoutActions" class="row"></div></main></div></section>
<section id="intervention" class="screen hidden"><div class="moment"><div id="interventionEy" class="ey"></div><p><span id="intervention1"></span><br><br><span id="intervention2" class="signal"></span></p><button id="interventionNext" class="primary"></button><div class="progress"><span class="on"></span><span class="on"></span><span></span><span></span><span></span></div></div></section>
<section id="career" class="screen hidden"><div class="workspace"><aside class="nav" id="careerNav"></aside><main class="main"><div id="careerCrumb" class="crumb"></div><div id="careerContent"></div></main></div></section>
<section id="travel" class="screen hidden"><div class="workspace"><aside class="nav" id="travelNav"></aside><main class="main"><div id="travelCrumb" class="crumb"></div><div id="travelContent"></div></main></div></section>
<section id="done" class="screen hidden"><div style="width:100%"><div id="doneEy" class="ey"></div><h1 id="doneTitle" style="font-size:clamp(40px,6vw,58px)"></h1><p id="doneLead" class="lead"></p><div class="summary"><div class="card"><div id="traceTitle" class="ey"></div><div id="trace" class="trace" style="margin-top:12px"></div></div><div class="card"><div id="shapeTitle" class="ey"></div><div id="journeyShape"></div><div id="researchBox" class="research hidden"></div></div></div><div class="row"><button id="exportBtn" class="primary"></button><button id="againBtn" class="btn"></button></div></div></section>
</div>
<script>
const $=id=>document.getElementById(id);const packs=window.PAJ_CHALLENGE_PACKS,depth=window.PAJ_CHALLENGE_DEPTH;const params=new URLSearchParams(location.search);const devMode=params.get('dev')==='1';let locale=params.get('locale')&&packs[params.get('locale')]?params.get('locale'):'zh-CN';let P=packs[locale],D=depth[locale];const S={started:0,events:[],views:{shop:[],career:[],travel:[]},choices:{},consequence:null,checkoutKind:null,travelDraft:null,travelExpanded:false,travelDetail:null};const now=()=>Math.round(performance.now()-S.started);const log=(type,data={})=>S.events.push({seq:S.events.length+1,t_ms:now(),type,...data});function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));$(id).classList.remove('hidden');scrollTo(0,0)}function active(nav,i){nav.querySelectorAll('button[data-i]').forEach(b=>b.classList.toggle('active',Number(b.dataset.i)===i))}function view(world,key){if(!S.views[world].includes(key))S.views[world].push(key);log('open_object',{world,object:key})}
function applyPack(){P=packs[locale];D=depth[locale];document.documentElement.lang=locale;$('market').textContent=P.market+' · '+P.currency;$('introEy').textContent=P.intro.ey;$('introTitle').textContent=P.intro.title;$('introLead').textContent=P.intro.lead;$('startBtn').textContent=P.intro.start;$('introHelp').textContent=P.intro.help;$('localeNote').textContent=D.marketNote;$('interventionEy').textContent=P.intervention.ey;$('intervention2').textContent=P.intervention.line2;$('interventionNext').textContent=P.intervention.next;$('shopCrumb').textContent=P.shop.crumb;$('checkoutCrumb').textContent=P.shop.crumb+' / '+P.shop.checkout;$('checkoutBrand').textContent=P.shop.checkout;$('checkoutNav').textContent=P.shop.checkout;$('checkoutBack').textContent='← '+P.shop.nav[0];$('checkoutDevices').textContent=P.shop.nav[1];$('careerCrumb').textContent=P.career.crumb;$('travelCrumb').textContent=P.travel.crumb;$('doneEy').textContent=P.done.ey;$('doneTitle').textContent=P.done.title;$('doneLead').textContent=P.done.lead;$('exportBtn').textContent=P.done.export;$('againBtn').textContent=P.done.again;$('traceTitle').textContent=D.done.trace;$('shapeTitle').textContent=D.done.shape;renderNavs()}
function renderNavs(){const nav=(el,brand,items,fn)=>{el.innerHTML=`<div class="brand">${brand}</div>`+items.map((x,i)=>`<button data-i="${i}">${x}</button>`).join('');el.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>fn(Number(b.dataset.i)))};nav($('shopNav'),P.shop.brand,P.shop.nav,shopView);nav($('careerNav'),P.career.brand,P.career.nav,careerView);nav($('travelNav'),P.travel.brand,P.travel.nav,travelView)}
function start(){S.started=performance.now();S.events=[];S.views={shop:[],career:[],travel:[]};S.choices={};S.consequence=null;S.checkoutKind=null;S.travelDraft=null;S.travelExpanded=false;S.travelDetail=null;log('session_start',{locale,market:P.market});show('shop');shopView(0)}
function shopView(i){view('shop','nav_'+i);active($('shopNav'),i);const c=$('shopContent'),s=P.shop;
if(i===0)c.innerHTML=`<div class="toolbar"><div><div class="ey">${s.brand}</div><h2>${s.title}</h2><div class="meta">${s.today}</div></div><span class="badge">${s.existing}</span></div><div class="productGrid">${s.products.map((p,j)=>`<article class="productCard"><div class="productVisual"><div class="hub ${p.kind==='pro'?'pro':''}"></div></div><div class="productTitle"><div><b>${p.name}</b><div class="meta">${p.desc}</div></div><div class="price" style="font-size:25px;margin:0">${p.price}</div></div><div class="quickFacts"><span class="fact">${p.kind==='pro'?'Thread':'Matter / Wi‑Fi'}</span><span class="fact">${p.rating}</span></div><div class="productActions"><span class="cartHint">${s.existing}</span><button class="primary chooseProduct" data-j="${j}">${s.buy}</button></div></article>`).join('')}</div><p class="help">${P.intro.help}</p>`;
if(i===1)c.innerHTML=`<div class="toolbar"><div><div class="ey">${s.brand}</div><h2>${s.deviceTitle}</h2><p class="meta">${s.deviceSub}</p></div><span class="badge">${s.devices.length}</span></div><div class="deviceList">${s.devices.map((d,j)=>`<div class="deviceRow"><div class="deviceIcon">${j<2?'◉':'◇'}</div><div><b>${d[0]}</b><div class="meta">${d[1]}</div></div><div><span class="compat ${d[2]}">${d[2]==='bridge'?s.bridge:s.direct}</span><button class="link device" data-j="${j}" style="display:block;margin-left:auto">${s.view}</button></div></div>`).join('')}</div>`;
if(i===2)c.innerHTML=`<div class="ey">${s.brand}</div><h2>${s.reviewsTitle}</h2><div class="card" style="padding:0 17px">${s.reviews.map(r=>`<div class="review"><div class="stars">★★★★★</div><b>${r[0]}</b><p>${r[1]}</p><p>${r[2]}</p><p class="meta">${r[3]}</p></div>`).join('')}</div>`;
if(i===3)c.innerHTML=`<div class="ey">${s.brand}</div><h2>${s.deliveryTitle}</h2><div class="card">${s.delivery.map(r=>`<div class="object"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>`;
if(i===4)c.innerHTML=`<div class="ey">${s.brand}</div><h2>${s.searchTitle}</h2><div class="panel"><input id="searchQ" class="search" placeholder="${s.searchPlaceholder}" autocomplete="off"><div class="searchSuggestions">${[s.products[0].name,s.products[1].name,s.devices[2][0]].map(x=>`<button class="btn searchSuggestion" data-q="${x.replace(/"/g,'&quot;')}">${x}</button>`).join('')}</div><button id="searchGo" class="primary" style="margin-top:11px">${s.search}</button><div id="searchOut" style="margin-top:12px"></div></div>`;
bindShop(i)}
function bindShop(i){document.querySelectorAll('.chooseProduct').forEach(b=>b.onclick=()=>chooseProduct(Number(b.dataset.j)));document.querySelectorAll('.device').forEach(b=>b.onclick=()=>{const j=Number(b.dataset.j),d=P.shop.devices[j];log('open_detail',{world:'shop',object:'device_'+j,compatibility:d[2]});$('shopContent').innerHTML=`<div class="ey">${P.shop.nav[1]}</div><h2>${d[0]}</h2><div class="card"><div class="deviceRow" style="border:0"><div class="deviceIcon">◇</div><div><b>${d[1]}</b><div class="meta">${d[2]==='bridge'?P.shop.bridge:P.shop.direct}</div></div><span class="compat ${d[2]}">${d[2]==='bridge'?P.shop.bridge:P.shop.direct}</span></div></div><button class="btn" onclick="shopView(1)" style="margin-top:12px">← ${P.shop.deviceTitle}</button>`});if(i===4&&$('searchGo')){const runSearch=()=>{const q=$('searchQ').value.trim();if(!q)return;log('search_query',{world:'shop',query_chars:q.length});const rows=[...P.shop.products.map((p,j)=>[p.name,p.desc,p.price,'product_'+j]),...P.shop.devices.map((d,j)=>[d[0],d[1],d[2]==='bridge'?P.shop.bridge:P.shop.direct,'device_'+j])].slice(0,5);$('searchOut').innerHTML=`<div class="card" style="padding:0 14px">${rows.map(r=>`<div class="searchResult"><div class="deviceIcon">⌕</div><div><b>${r[0]}</b><div class="meta">${r[1]}</div></div><span class="meta">${r[2]}</span></div>`).join('')}</div>`};$('searchGo').onclick=runSearch;document.querySelectorAll('.searchSuggestion').forEach(b=>b.onclick=()=>{$('searchQ').value=b.dataset.q;runSearch()});$('searchQ').onkeydown=e=>{if(e.key==='Enter')runSearch()}}}
function chooseProduct(j){const p=P.shop.products[j];S.checkoutKind=p.kind;S.consequence=p.kind==='lite'?'bridge':'delivery';log('provisional_commit',{world:'shop',choice:p.kind});log('consequence_exposed',{world:'shop',choice:p.kind,consequence:S.consequence});renderCheckout();show('checkout')}
function renderCheckout(){const s=P.shop,kind=S.checkoutKind,selected=s.products.find(x=>x.kind===kind);$('checkoutDetail').innerHTML='';if(kind==='lite'){$('extraTitle').textContent=s.extraTitle;$('checkoutCard').innerHTML=`<div class="object"><div><b>${selected.name}</b><div class="meta">${selected.desc}</div></div><b>${selected.price}</b></div><div class="object"><div><b>${s.bridgeName}</b><div class="meta">${s.bridgeReason}</div></div><b>${s.bridgePrice}</b></div><div class="object"><b>${s.total}</b></div>`;$('consequence').textContent=s.consequence;$('checkoutActions').innerHTML=`<button id="keep" class="primary">${s.keep}</button><button id="change" class="btn">${s.change}</button><button id="inspect" class="btn">${s.inspect}</button>`}else{$('extraTitle').textContent=D.checkout.proTitle;$('checkoutCard').innerHTML=`<div class="object"><div><b>${selected.name}</b><div class="meta">${selected.desc}</div></div><b>${selected.price}</b></div><div class="object"><span>${P.shop.deliveryTitle}</span><b>${D.checkout.proKeep}</b></div>`;$('consequence').textContent=D.checkout.proConsequence;$('checkoutActions').innerHTML=`<button id="keep" class="primary">${D.checkout.proKeep}</button><button id="change" class="btn">${D.checkout.switchLite}</button><button id="inspect" class="btn">${D.checkout.proInspect}</button>`}$('keep').onclick=()=>checkoutAction('keep');$('change').onclick=()=>checkoutAction('change');$('inspect').onclick=()=>checkoutAction('inspect')}
function checkoutAction(a){log('post_consequence_action',{world:'shop',action:a,selected:S.checkoutKind,consequence:S.consequence});if(a==='change'){S.checkoutKind=S.checkoutKind==='lite'?'pro':'lite';S.consequence=S.checkoutKind==='lite'?'bridge':'delivery';log('consequence_exposed',{world:'shop',choice:S.checkoutKind,consequence:S.consequence,after_switch:true});renderCheckout();return}if(a==='inspect'){if(S.checkoutKind==='lite'){log('open_detail',{world:'shop',object:'affected_devices'});$('checkoutDetail').innerHTML=`<div class="panel"><b>${P.shop.deviceTitle}</b>${P.shop.devices.filter(d=>d[2]==='bridge').map(d=>`<div class="object"><span>${d[0]}</span><b>${d[1]}</b></div>`).join('')}</div>`}else{log('open_detail',{world:'shop',object:'pickup_option'});$('checkoutDetail').innerHTML=`<div class="panel"><b>${P.shop.deliveryTitle}</b><p>${D.checkout.pickup}</p></div>`}return}S.choices.shop=S.checkoutKind;log('commit',{world:'shop',choice:S.checkoutKind,consequence:S.consequence,opened:[...S.views.shop]});$('intervention1').textContent=S.checkoutKind==='lite'?P.intervention.line1:D.checkout.proLine1;show('intervention')}
function careerStart(){log('minimal_intervention',{dose:'one_sentence'});show('career');careerView(0)}
function careerView(i){view('career','nav_'+i);active($('careerNav'),i);const c=$('careerContent'),w=P.career,A=w.offers[0],B=w.offers[1],offer=o=>`<div class="card"><div class="ey">${o.company}</div><h2>${o.role}</h2><div class="price" style="font-size:27px">${o.pay}</div><p>${o.summary}</p><div class="object"><span>${w.labels.probation}</span><b>${o.probation}</b></div><div class="object"><span>${w.labels.place}</span><b>${o.place}</b></div><div class="row"><button class="btn contract" data-k="${o.key}">${w.labels.contract}</button><button class="btn team" data-k="${o.key}">${w.labels.team}</button><button class="btn mobility" data-k="${o.key}">${D.career.mobility}</button></div></div><div class="decisionbar row"><button class="primary careerChoose" data-k="${o.key}">${w.labels.choose} ${o.key}</button></div>`;if(i===0)c.innerHTML=`<h2>${w.nav[0]}</h2><div class="object"><div><b>${A.company} · ${A.role}</b><div class="meta">${A.pay}</div></div><button class="link openOffer" data-i="1">→</button></div><div class="object"><div><b>${B.company} · ${B.role}</b><div class="meta">${B.pay}</div></div><button class="link openOffer" data-i="2">→</button></div><p class="help">${w.ask}</p><div class="decisionbar row"><button class="primary careerChoose" data-k="A">${w.labels.choose} A</button><button class="primary careerChoose" data-k="B">${w.labels.choose} B</button></div>`;if(i===1)c.innerHTML=offer(A);if(i===2)c.innerHTML=offer(B);if(i===3)c.innerHTML=`<h2>${w.nav[3]}</h2><div class="panel">${w.labels.companies}</div><div class="cards"><div class="card"><b>${A.company}</b><p>${A.summary}</p></div><div class="card"><b>${B.company}</b><p>${B.summary}</p></div></div>`;if(i===4)c.innerHTML=`<h2>${w.nav[4]}</h2><div class="panel">${w.labels.calendar}</div>`;if(i===5)c.innerHTML=`<h2>${w.nav[5]}</h2><div class="cards"><div class="card"><b>${A.company}</b><div class="price" style="font-size:23px">${A.commute}</div></div><div class="card"><b>${B.company}</b><div class="price" style="font-size:23px">${B.commute}</div></div></div>`;bindCareer()}
function bindCareer(){document.querySelectorAll('.openOffer').forEach(b=>b.onclick=()=>careerView(Number(b.dataset.i)));document.querySelectorAll('.careerChoose').forEach(b=>b.onclick=()=>careerCommit(b.dataset.k));document.querySelectorAll('.contract').forEach(b=>b.onclick=()=>careerDetail(b.dataset.k,'contract'));document.querySelectorAll('.team').forEach(b=>b.onclick=()=>careerDetail(b.dataset.k,'team'));document.querySelectorAll('.mobility').forEach(b=>b.onclick=()=>careerDetail(b.dataset.k,'mobility'))}
function careerDetail(k,type){const o=P.career.offers[k==='A'?0:1],label=type==='contract'?P.career.labels.contract:type==='team'?P.career.labels.team:D.career.mobility,body=type==='mobility'?(k==='A'?D.career.a:D.career.b):o[type];log('open_detail',{world:'career',object:type+'_'+k});$('careerContent').innerHTML=`<h2>${o.company}</h2><div class="card"><div class="ey">${label}</div><p class="lead" style="font-size:18px">${body}</p></div><button class="btn" onclick="careerView(${k==='A'?1:2})">← ${o.company}</button>`}
function careerCommit(k){S.choices.career=k;log('commit',{world:'career',choice:k,opened:[...S.views.career]});show('travel');travelView(0)}
function travelView(i){S.travelDraft=null;S.travelExpanded=false;S.travelDetail=null;view('travel','nav_'+i);active($('travelNav'),i);const c=$('travelContent'),w=P.travel;if(i===0)c.innerHTML=`<div class="toolbar"><div><h2>${w.title}</h2><div class="meta">${w.meta}</div></div></div><div class="cards">${w.options.map(o=>`<div class="card"><div class="ey">${o.key}</div><div class="price">${o.price}</div><p>${o.time}</p><div class="meta">${o.desc}</div><button class="primary travelChoose" data-k="${o.key}">${w.book} ${o.key}</button></div>`).join('')}</div>`;if(i===1)c.innerHTML=`<h2>${w.nav[1]}</h2><div class="panel">${w.itinerary}</div>`;if(i===2)c.innerHTML=travelInfoPage(i,w.airport,D.travel.transportExtra,'transport');if(i===3)c.innerHTML=travelInfoPage(i,w.hotel,D.travel.hotelExtra,'hotel');if(i===4)c.innerHTML=travelInfoPage(i,w.calendar,D.travel.morningExtra,'morning');document.querySelectorAll('.travelChoose').forEach(b=>b.onclick=()=>travelCommit(b.dataset.k));document.querySelectorAll('.travelNested').forEach(b=>b.onclick=()=>openTravelTopDetail(b.dataset.kind,b.dataset.extra))}
function travelInfoPage(i,base,extra,kind){return `<h2>${P.travel.nav[i]}</h2><div class="panel">${base}</div><button class="btn travelNested" data-kind="${kind}" data-extra="${encodeURIComponent(extra)}" style="margin-top:12px">${D.travel.inspect}</button><div id="travelExtra"></div>`}
function openTravelTopDetail(kind,encoded){const extra=decodeURIComponent(encoded);log('open_detail',{world:'travel',object:kind+'_detail'});$('travelExtra').innerHTML=`<div class="notice">${extra}</div>`}
function travelCommit(k){S.travelDraft=k;S.travelExpanded=false;S.travelDetail=null;log('provisional_commit',{world:'travel',choice:k});renderTravelHold()}
function renderTravelHold(){const w=P.travel,o=w.options.find(x=>x.key===S.travelDraft),other=w.options.find(x=>x.key!==S.travelDraft),late=S.travelDraft==='A';active($('travelNav'),0);$('travelContent').innerHTML=`<div class="ey">${D.travel.reviewTitle}</div><h2>${w.title}</h2><div class="card"><div class="object"><span>${D.travel.selected}</span><b>${o.key} · ${o.price}</b></div><div class="object"><span>${o.time}</span><span class="meta">${o.desc}</span></div></div><div class="notice ${late?'':'good'}">${late?D.travel.lateNotice:D.travel.earlyNotice}</div>${S.travelExpanded?renderArrivalObjects():''}<div class="row"><button id="travelConfirm" class="primary">${D.travel.confirm}</button><button id="travelSwitch" class="btn">${D.travel.switch} · ${other.key}</button><button id="travelInspect" class="btn">${D.travel.inspect}</button><button id="travelBack" class="btn">← ${D.travel.back}</button></div>`;bindTravelHold()}
function renderArrivalObjects(){const w=P.travel,d=D.travel;return `<div class="nested"><div class="card"><b>${w.nav[2]}</b><p>${w.airport}</p><button class="link holdDetail" data-kind="transport">→</button></div><div class="card"><b>${w.nav[3]}</b><p>${w.hotel}</p><button class="link holdDetail" data-kind="hotel">→</button></div><div class="card"><b>${w.nav[4]}</b><p>${w.calendar}</p><button class="link holdDetail" data-kind="morning">→</button></div></div><div id="holdDetailOut">${S.travelDetail?`<div class="notice">${S.travelDetail==='transport'?d.transportExtra:S.travelDetail==='hotel'?d.hotelExtra:d.morningExtra}</div>`:''}</div>`}
function bindTravelHold(){$('travelConfirm').onclick=()=>finalizeTravel();$('travelSwitch').onclick=()=>{S.travelDraft=S.travelDraft==='A'?'B':'A';S.travelDetail=null;log('post_consequence_action',{world:'travel',action:'switch_time',choice:S.travelDraft});renderTravelHold()};$('travelInspect').onclick=()=>{S.travelExpanded=true;log('open_detail',{world:'travel',object:'arrival_plan'});renderTravelHold()};$('travelBack').onclick=()=>travelView(0);document.querySelectorAll('.holdDetail').forEach(b=>b.onclick=()=>{S.travelDetail=b.dataset.kind;log('open_detail',{world:'travel',object:b.dataset.kind+'_nested'});renderTravelHold()})}
function finalizeTravel(){const k=S.travelDraft;S.choices.travel=k;log('commit',{world:'travel',choice:k,opened:[...S.views.travel],arrival_plan:S.travelExpanded});finish()}
function finish(){log('session_complete',{market:P.market});window.PAJGoldenStudy?.complete({family:'PF01',instrument_version:'golden-challenge-v2',locale,market:P.market,world_variant:'golden-three-world-v1',terminal_action:S.choices.travel||'',events:S.events});$('trace').innerHTML=S.events.filter(e=>e.type!=='session_start').map(e=>`<div>#${e.seq} · ${e.t_ms}ms · ${e.world||'journey'}${e.object?' / '+e.object:''}${e.choice?' / '+e.choice:''}${e.action?' / '+e.action:''}</div>`).join('');const detailCount=S.events.filter(e=>e.type==='open_detail').length,revisionCount=S.events.filter(e=>e.type==='post_consequence_action').length;$('journeyShape').innerHTML=`<div class="object"><span>1</span><b>${P.shop.brand}</b></div><div class="object"><span>2</span><b>${P.career.brand}</b></div><div class="object"><span>3</span><b>${P.travel.brand}</b></div><div class="cards"><div class="card"><div class="count">${detailCount}</div><div class="meta">${D.done.details}</div></div><div class="card"><div class="count">${revisionCount}</div><div class="meta">${D.done.revisions}</div></div></div>`;if(devMode){$('researchBox').classList.remove('hidden');$('researchBox').innerHTML='<b>Research view</b><p>Seed world → ordinary consequence → one-sentence structural cue → near transfer → far transfer. This preview is local-only; participant behavior remains separate from downstream interpretation.</p>'}else $('researchBox').classList.add('hidden');show('done')}
function exportTrace(){const payload={instrument:'golden-challenge-v2',locale,market:P.market,world_pack:P.currency,events:S.events,views:S.views,choices:S.choices,seed_consequence:S.consequence,travel_draft:S.travelDraft};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=`paj-golden-${P.market}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
Object.entries(packs).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v.native;$('locale').appendChild(o)});$('locale').value=locale;$('locale').onchange=e=>{locale=e.target.value;history.replaceState(null,'',`?locale=${encodeURIComponent(locale)}${devMode?'&dev=1':''}`);applyPack();show('intro')};$('startBtn').onclick=start;$('checkoutBack').onclick=()=>{show('shop');shopView(0)};$('checkoutDevices').onclick=()=>{show('shop');shopView(1)};$('interventionNext').onclick=careerStart;$('exportBtn').onclick=exportTrace;$('againBtn').onclick=()=>location.reload();applyPack();
</script></body></html>
