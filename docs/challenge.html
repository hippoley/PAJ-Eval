<script>
const $=id=>document.getElementById(id);const packs=window.PAJ_CHALLENGE_PACKS,depth=window.PAJ_CHALLENGE_DEPTH,uiPacks=window.PAJ_JOURNEY01_UI;const params=new URLSearchParams(location.search);const devMode=params.get('dev')==='1';let locale=params.get('locale')&&packs[params.get('locale')]?params.get('locale'):'zh-CN';let P=packs[locale],D=depth[locale],U=uiPacks[locale];const S={started:0,events:[],views:{shop:[],career:[],travel:[]},choices:{},consequence:null,checkoutKind:null,travelDraft:null,travelExpanded:false,travelDetail:null,focusedProduct:null,focusedOffer:null,focusedFlight:null,cartProduct:null,shopQuery:''};const now=()=>Math.round(performance.now()-S.started);const log=(type,data={})=>S.events.push({seq:S.events.length+1,t_ms:now(),type,...data});function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));$(id).classList.remove('hidden');scrollTo(0,0)}function active(nav,i){nav.querySelectorAll('button[data-i]').forEach(b=>b.classList.toggle('active',Number(b.dataset.i)===i))}function view(world,key){if(!S.views[world].includes(key))S.views[world].push(key);log('open_object',{world,object:key});updateGuide(world)}
function renderWorldPath(elId,currentWorld){const el=$(elId);if(!el)return;const order=['shop','career','travel'],current=order.indexOf(currentWorld);el.innerHTML=order.map((w,i)=>`<span class="${i===current?'on':i<current?'done':''}">${i+1} · ${U.map[w]}</span>${i<2?'<i></i>':''}`).join('')}
function guideSpec(world){
  if(world==='shop')return {el:'shopContext',title:U.guide.shopTitle,sub:U.guide.shopSub,indices:[1,2,3],labels:P.shop.nav};
  if(world==='career')return {el:'careerContext',title:U.guide.careerTitle,sub:U.guide.careerSub,indices:[1,2,5],labels:P.career.nav};
  return {el:'travelContext',title:U.guide.travelTitle,sub:U.guide.travelSub,indices:[2,3,4],labels:P.travel.nav};
}
function contextFlow(world){
  const order=['shop','career','travel'],current=order.indexOf(world);
  return order.map((w,i)=>`<span class="${i===current?'on':i<current?'done':''}">${i+1}</span>${i<2?'<i>→</i>':''}`).join('');
}
function updateGuide(world,targetId){
  const g=guideSpec(world),el=$(targetId||g.el);if(!el)return;
  const workspace=el.closest('.workspace');if(!('collapsed' in el.dataset))el.dataset.collapsed='1';const collapsed=el.dataset.collapsed==='1';

    el.querySelector('.contextCollapsedButton').onclick=()=>{el.dataset.collapsed='0';updateGuide(world,targetId)};

  }
  const actions=g.indices.map((i,pos)=>{const done=S.views[world].includes('nav_'+i);return `<button type="button" class="contextAction ${done?'done':''}" data-i="${i}"><span class="contextIndex">${done?'✓':String(pos+1).padStart(2,'0')}</span><span><strong>${g.labels[i]}</strong><small>${done?U.guide.checked:U.guide.optional}</small></span><span class="contextArrow">↗</span></button>`}).join('');
  el.innerHTML=`<div class="contextLayerRow"><div class="contextLayerTag">${U.guide.cue}</div><button type="button" class="contextToggle" aria-label="${U.guide.cue}">−</button></div><div class="contextFlow">${contextFlow(world)}</div><div class="contextHead"><b>${g.title}</b><p>${g.sub}</p><div class="contextHintNote">${U.guide.optional}</div></div><div class="contextListLabel">${U.guide.recommended}</div><div class="contextActions">${actions}</div><div class="contextFoot">${U.guide.optional}</div>`;

}
function bindTravelChrome(){document.querySelectorAll('.travelTab,.tripEdit').forEach(b=>b.onclick=()=>travelView(Number(b.dataset.i)))}
function travelView(i){S.travelDraft=null;S.travelExpanded=false;S.travelDetail=null;view('travel','nav_'+i);active($('travelNav'),i);const c=$('travelContent'),w=P.travel;let body='';
  if(i===0)body=`<div class="travelHeader"><div><div class="ey">${w.brand}</div><h2>${w.title}</h2><div class="meta">${w.meta}</div></div><span class="badge">${w.options.length}</span></div><div class="travelGrid">${w.options.map(o=>`<div class="flightRow" data-k="${o.key}" tabindex="0"><div><div class="ey">${o.key}</div><div class="flightTimes">${o.time}</div></div><div class="meta">${o.desc}</div><div><div class="flightPrice">${o.price}</div><button class="primary travelChoose" data-k="${o.key}" style="margin-top:8px;width:100%">${w.book} ${o.key}</button></div></div>`).join('')}</div>`;
  if(i===1)body=`<div class="travelHeader"><h2>${w.nav[1]}</h2></div><div class="travelInfoCard"><div class="timeline"><div class="timeEvent"><b>${w.itinerary}</b><div class="meta">${w.meta}</div></div></div></div>`;
  if(i===2)body=travelInfoPage(i,w.airport,D.travel.transportExtra,'transport');

  c.innerHTML=travelShell(i,body);bindTravelChrome();document.querySelectorAll('.travelChoose').forEach(b=>b.onclick=e=>{e.stopPropagation();travelCommit(b.dataset.k)});document.querySelectorAll('.flightRow').forEach(row=>{row.onclick=e=>{if(e.target.closest('button'))return;focusFlight(row.dataset.k)};row.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('button')){e.preventDefault();focusFlight(row.dataset.k)}}});document.querySelectorAll('.travelNested').forEach(b=>b.onclick=()=>openTravelTopDetail(b.dataset.kind,b.dataset.extra));updateGuide('travel')
}
function travelInfoPage(i,base,extra,kind){return `<div class="travelHeader"><h2>${P.travel.nav[i]}</h2></div><section class="travelInfoCard"><div>${base}</div><button class="btn travelNested" data-kind="${kind}" data-extra="${encodeURIComponent(extra)}" style="margin-top:14px">${D.travel.inspect}</button><div id="travelExtra"></div></section>`}
function openTravelTopDetail(kind,encoded){const extra=decodeURIComponent(encoded);log('open_detail',{world:'travel',object:kind+'_detail'});$('travelExtra').innerHTML=`<div class="notice">${extra}</div>`}
function travelCommit(k){S.travelDraft=k;S.travelExpanded=false;S.travelDetail=null;log('provisional_commit',{world:'travel',choice:k});renderTravelHold()}
function renderTravelHold(){const w=P.travel,o=w.options.find(x=>x.key===S.travelDraft),other=w.options.find(x=>x.key!==S.travelDraft),late=S.travelDraft==='A';active($('travelNav'),0);const body=`<div class="travelHeader"><div><div class="ey">${D.travel.reviewTitle}</div><h2>${w.title}</h2></div></div><section class="travelInfoCard"><div class="object"><span>${D.travel.selected}</span><b>${o.key} · ${o.price}</b></div><div class="object"><span>${o.time}</span><span class="meta">${o.desc}</span></div><div class="notice ${late?'':'good'}">${late?D.travel.lateNotice:D.travel.earlyNotice}</div>${S.travelExpanded?renderArrivalObjects():''}<div class="row"><button id="travelConfirm" class="primary">${D.travel.confirm}</button><button id="travelSwitch" class="btn">${D.travel.switch} · ${other.key}</button><button id="travelInspect" class="btn">${D.travel.inspect}</button><button id="travelBack" class="btn">← ${D.travel.back}</button></div></section>`;$('travelContent').innerHTML=travelShell(0,body);bindTravelChrome();bindTravelHold();updateGuide('travel')}
function renderArrivalObjects(){const w=P.travel,d=D.travel;return `<div class="nested"><div class="card"><b>${w.nav[2]}</b><p>${w.airport}</p><button class="link holdDetail" data-kind="transport">→</button></div><div class="card"><b>${w.nav[3]}</b><p>${w.hotel}</p><button class="link holdDetail" data-kind="hotel">→</button></div><div class="card"><b>${w.nav[4]}</b><p>${w.calendar}</p><button class="link holdDetail" data-kind="morning">→</button></div></div><div id="holdDetailOut">${S.travelDetail?`<div class="notice">${S.travelDetail==='transport'?d.transportExtra:S.travelDetail==='hotel'?d.hotelExtra:d.morningExtra}</div>`:''}</div>`}
function bindTravelHold(){$('travelConfirm').onclick=()=>finalizeTravel();$('travelSwitch').onclick=()=>{S.travelDraft=S.travelDraft==='A'?'B':'A';S.travelDetail=null;log('post_consequence_action',{world:'travel',action:'switch_time',choice:S.travelDraft});renderTravelHold()};$('travelInspect').onclick=()=>{S.travelExpanded=true;log('open_detail',{world:'travel',object:'arrival_plan'});renderTravelHold()};$('travelBack').onclick=()=>travelView(0);document.querySelectorAll('.holdDetail').forEach(b=>b.onclick=()=>{S.travelDetail=b.dataset.kind;log('open_detail',{world:'travel',object:b.dataset.kind+'_nested'});renderTravelHold()})}
function finalizeTravel(){const k=S.travelDraft;S.choices.travel=k;log('commit',{world:'travel',choice:k,opened:[...S.views.travel],arrival_plan:S.travelExpanded});finish()}
function navLabel(world,key){const m=String(key||'').match(/^nav_(\d+)$/);const list=P[world]?.nav||[];return m&&list[Number(m[1])]?list[Number(m[1])]:String(key||'')}
function detailLabel(world,obj){
  const o=String(obj||'');
  if(world==='shop'){
    if(o==='affected_devices')return P.shop.deviceTitle;
    if(o==='pickup_option')return P.shop.deliveryTitle;
    const m=o.match(/^device_(\d+)$/);if(m&&P.shop.devices[Number(m[1])])return P.shop.devices[Number(m[1])][0];
  }
  if(world==='career'){
    const m=o.match(/^(contract|team|mobility)_([AB])$/);if(m){const offer=P.career.offers[m[2]==='A'?0:1];const label=m[1]==='contract'?P.career.labels.contract:m[1]==='team'?P.career.labels.team:D.career.mobility;return offer.company+' · '+label}
  }
  if(world==='travel'){
    if(o.includes('transport'))return P.travel.nav[2];
    if(o.includes('hotel'))return P.travel.nav[3];
    if(o.includes('morning'))return P.travel.nav[4];
    if(o==='arrival_plan')return P.travel.itinerary;
  }
  return o.replace(/_/g,' ');
}
function choiceLabel(world,choice){
  if(!choice)return U.map.none;
  if(world==='shop'){const p=P.shop.products.find(x=>x.kind===choice);return p?p.name:String(choice)}
  if(world==='career'){const o=P.career.offers.find(x=>x.key===choice);return o?o.company+' · '+o.role:String(choice)}
  if(world==='travel'){const o=P.travel.options.find(x=>x.key===choice);return o?o.key+' · '+o.time+' · '+o.price:String(choice)}
  return String(choice);
}
function consequenceLabel(world,choice){
  if(world==='shop')return choice==='lite'?P.shop.bridgeReason:D.checkout.proConsequence;
  if(world==='travel')return choice==='A'?D.travel.lateNotice:D.travel.earlyNotice;
  return U.map.choiceOnly;
}
function mapWorldData(world){
  const list=P[world].nav||[],opened=(S.views[world]||[]).map(k=>navLabel(world,k));
  const details=[...new Set(S.events.filter(e=>e.type==='open_detail'&&e.world===world).map(e=>detailLabel(world,e.object)))];
  const missed=list.filter((_,i)=>!(S.views[world]||[]).includes('nav_'+i));
  const choice=S.choices[world]||null;
  const revisions=S.events.filter(e=>e.type==='post_consequence_action'&&e.world===world).length;
  return {world,opened,details,missed,choice,choiceLabel:choiceLabel(world,choice),consequence:consequenceLabel(world,choice),revisions};
}
function renderDecisionMap(){
  const worlds=['shop','career','travel'],data=worlds.map(mapWorldData);
  $('shapeTitle').textContent=U.map.title;$('mapSub').textContent=U.map.sub;$('mapCount').textContent=U.map.stages;
  $('journeyShape').innerHTML=data.map((d,i)=>`<button type="button" class="mapWorld ${i===0?'active':''}" data-world="${d.world}"><div class="mapOrb"><span>0${i+1}</span></div><h3>${d.world==='shop'?P.shop.brand:d.world==='career'?P.career.brand:P.travel.brand}</h3><div class="mapChoice">${d.choiceLabel}</div><div class="mapOutcome"><span class="ey">${U.map.consequence}</span><div>${d.consequence}</div></div><div class="mapStats"><span class="mapStat">${U.map.opened} · ${d.opened.length}</span><span class="mapStat">${U.map.details} · ${d.details.length}</span><span class="mapStat missed">${U.map.missed} · ${d.missed.length}</span></div></button>${i<2?'<div class="mapArrow"></div>':''}`).join('');
  document.querySelectorAll('.mapWorld').forEach(b=>b.onclick=()=>inspectMapWorld(b.dataset.world));
  inspectMapWorld('shop');
}
function inspectMapWorld(world){
  const d=mapWorldData(world);document.querySelectorAll('.mapWorld').forEach(b=>b.classList.toggle('active',b.dataset.world===world));
  const tags=(xs,missed=false)=>xs.length?xs.map(x=>`<span class="inspectTag ${missed?'missed':''}">${x}</span>`).join(''):`<span class="inspectTag ${missed?'missed':''}">${U.map.none}</span>`;
  $('mapInspector').innerHTML=`<div class="inspectGrid"><div class="inspectCol"><h4>${U.map.opened}</h4><div class="inspectList">${tags(d.opened)}</div>${d.details.length?`<h4 style="margin-top:12px">${U.map.details}</h4><div class="inspectList">${tags(d.details)}</div>`:''}</div><div class="inspectCol"><h4>${U.map.missed}</h4><div class="inspectList">${tags(d.missed,true)}</div></div></div><div class="inspectMeta"><span>${U.map.decision}: <b>${d.choiceLabel}</b></span><span>${U.map.revisions}: <b>${d.revisions}</b></span></div>`;
}
function finish(){log('session_complete',{market:P.market});window.PAJGoldenStudy?.complete({family:'PF01',instrument_version:'golden-challenge-v2',locale,market:P.market,world_variant:'golden-three-world-v1',terminal_action:S.choices.travel||'',events:S.events});renderDecisionMap();if(devMode){$('rawTraceCard').classList.remove('hidden');$('trace').innerHTML=S.events.filter(e=>e.type!=='session_start').map(e=>`<div>#${e.seq} · ${e.t_ms}ms · ${e.world||'journey'}${e.object?' / '+e.object:''}${e.choice?' / '+e.choice:''}${e.action?' / '+e.action:''}</div>`).join('');$('researchBox').classList.remove('hidden');$('researchBox').innerHTML='<b>Research view</b><p>Seed world → ordinary consequence → one-sentence structural cue → near transfer → far transfer. This preview is local-only; participant behavior remains separate from downstream interpretation.</p>'}else{$('rawTraceCard').classList.add('hidden');$('researchBox').classList.add('hidden')}show('done')}
function exportTrace(){const payload={instrument:'golden-challenge-v2',locale,market:P.market,world_pack:P.currency,events:S.events,views:S.views,choices:S.choices,seed_consequence:S.consequence,travel_draft:S.travelDraft};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=`paj-golden-${P.market}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
Object.entries(packs).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v.native;$('locale').appendChild(o)});$('locale').value=locale;$('locale').onchange=e=>{locale=e.target.value;history.replaceState(null,'',`?locale=${encodeURIComponent(locale)}${devMode?'&dev=1':''}`);applyPack();show('intro')};$('startBtn').onclick=start;$('checkoutBack').onclick=()=>{show('shop');shopView(0)};$('checkoutDevices').onclick=()=>{show('shop');shopView(1)};$('interventionNext').onclick=careerStart;$('exportBtn').onclick=exportTrace;$('againBtn').onclick=()=>location.reload();$('cartClose').onclick=closeCartLayerOnly;$('cartScrim').onclick=closeCartLayerOnly;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCartLayerOnly()});applyPack();
