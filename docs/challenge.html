function renderNavs(){const nav=(el,brand,items,fn)=>{el.innerHTML=`<div class="brand">${brand}</div>`+items.map((x,i)=>`<button data-i="${i}">${x}</button>`).join('');el.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>fn(Number(b.dataset.i)))};nav($('shopNav'),P.shop.brand,P.shop.nav,shopView);nav($('careerNav'),P.career.brand,P.career.nav,careerView);nav($('travelNav'),P.travel.brand,P.travel.nav,travelView)}
function start(){S.started=performance.now();S.events=[];S.views={shop:[],career:[],travel:[]};S.choices={};S.consequence=null;S.checkoutKind=null;S.travelDraft=null;S.travelExpanded=false;S.travelDetail=null;S.focusedProduct=null;log('session_start',{locale,market:P.market});show('shop');shopView(0)}
function shopView(i){view('shop','nav_'+i);active($('shopNav'),i);const c=$('shopContent'),s=P.shop;
if(i===0)c.innerHTML=`<div class="toolbar"><div><div class="ey">${s.brand}</div><h2>${s.title}</h2><div class="meta">${s.today}</div></div><span class="badge">${s.existing}</span></div><div class="productGrid">${s.products.map((p,j)=>`<article class="productCard" data-j="${j}" tabindex="0"><div class="productVisual"><div class="hub ${p.kind==='pro'?'pro':''}"></div><button type="button" class="visualHotspot" data-peek="1" aria-label="${s.deviceTitle}"><span>＋</span><em>${s.deviceTitle}</em></button></div><div class="productTitle"><div><b>${p.name}</b><div class="meta">${p.desc}</div></div><div class="price" style="font-size:25px;margin:0">${p.price}</div></div><div class="quickFacts"><span class="fact">${p.kind==='pro'?'Thread':'Matter / Wi‑Fi'}</span><span class="fact">${p.rating}</span></div><div class="productActions"><span class="cartHint">${s.existing}</span><button class="primary chooseProduct" data-j="${j}">${s.buy}</button></div></article>`).join('')}</div><p class="help">${P.intro.help}</p>`;

function bindShop(i){document.querySelectorAll('.chooseProduct').forEach(b=>b.onclick=()=>chooseProduct(Number(b.dataset.j)));document.querySelectorAll('.visualHotspot').forEach(b=>b.onclick=e=>{e.stopPropagation();openContextDetail('shop',Number(b.dataset.peek))});document.querySelectorAll('.productCard').forEach(card=>{card.onclick=e=>{if(e.target.closest('button'))return;focusProduct(Number(card.dataset.j))};card.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('button')){e.preventDefault();focusProduct(Number(card.dataset.j))}}});document.querySelectorAll('.device').forEach(b=>b.onclick=()=>{const j=Number(b.dataset.j),d=P.shop.devices[j];log('open_detail',{world:'shop',object:'device_'+j,compatibility:d[2]});$('shopContent').innerHTML=`<div class="ey">${P.shop.nav[1]}</div><h2>${d[0]}</h2><div class="card"><div class="deviceRow" style="border:0"><div class="deviceIcon">◇</div><div><b>${d[1]}</b><div class="meta">${d[2]==='bridge'?P.shop.bridge:P.shop.direct}</div></div><span class="compat ${d[2]}">${d[2]==='bridge'?P.shop.bridge:P.shop.direct}</span></div></div><button class="btn" onclick="shopView(1)" style="margin-top:12px">← ${P.shop.deviceTitle}</button>`});if(i===4&&$('searchGo')){const runSearch=()=>{const q=$('searchQ').value.trim();if(!q)return;log('search_query',{world:'shop',query_chars:q.length});const rows=[...P.shop.products.map((p,j)=>[p.name,p.desc,p.price,'product_'+j]),...P.shop.devices.map((d,j)=>[d[0],d[1],d[2]==='bridge'?P.shop.bridge:P.shop.direct,'device_'+j])].slice(0,5);$('searchOut').innerHTML=`<div class="card" style="padding:0 14px">${rows.map(r=>`<div class="searchResult"><div class="deviceIcon">⌕</div><div><b>${r[0]}</b><div class="meta">${r[1]}</div></div><span class="meta">${r[2]}</span></div>`).join('')}</div>`};$('searchGo').onclick=runSearch;document.querySelectorAll('.searchSuggestion').forEach(b=>b.onclick=()=>{$('searchQ').value=b.dataset.q;runSearch()});$('searchQ').onkeydown=e=>{if(e.key==='Enter')runSearch()}}}
function chooseProduct(j){const p=P.shop.products[j];S.checkoutKind=p.kind;S.consequence=p.kind==='lite'?'bridge':'delivery';log('provisional_commit',{world:'shop',choice:p.kind});log('consequence_exposed',{world:'shop',choice:p.kind,consequence:S.consequence});renderCheckout();show('checkout')}
function renderCheckout(){const s=P.shop,kind=S.checkoutKind,selected=s.products.find(x=>x.kind===kind);updateGuide('shop','checkoutContext');$('checkoutDetail').innerHTML='';if(kind==='lite'){$('extraTitle').textContent=s.extraTitle;$('checkoutCard').innerHTML=`<div class="checkoutFlow"><div class="checkoutNode"><div class="ey">${selected.name}</div><div class="price" style="font-size:25px">${selected.price}</div><div class="meta">${selected.desc}</div></div><div class="checkoutArrow">→</div><div class="checkoutNode"><div class="ey">${s.bridgeName}</div><div class="price" style="font-size:25px">${s.bridgePrice}</div><div class="meta">${s.bridgeReason}</div></div></div><div class="impactList"><div class="impactItem"><span>${P.shop.devices.filter(d=>d[2]==='bridge')[0][0]}</span><b>${P.shop.devices.filter(d=>d[2]==='bridge')[0][1]}</b></div><div class="impactItem"><span>${P.shop.devices.filter(d=>d[2]==='bridge')[1][0]}</span><b>${P.shop.devices.filter(d=>d[2]==='bridge')[1][1]}</b></div><div class="impactItem"><b>${s.total}</b><b>${selected.price} + ${s.bridgePrice}</b></div></div>`;$('consequence').textContent=s.consequence;$('checkoutActions').innerHTML=`<button id="keep" class="primary">${s.keep}</button><button id="change" class="btn">${s.change}</button><button id="inspect" class="btn">${s.inspect}</button>`}else{$('extraTitle').textContent=D.checkout.proTitle;$('checkoutCard').innerHTML=`<div class="checkoutFlow"><div class="checkoutNode"><div class="ey">${selected.name}</div><div class="price" style="font-size:25px">${selected.price}</div><div class="meta">${selected.desc}</div></div><div class="checkoutArrow">→</div><div class="checkoutNode"><div class="ey">${P.shop.deliveryTitle}</div><div style="font-size:21px;font-weight:760;margin-top:8px">${D.checkout.proKeep}</div><div class="meta">${D.checkout.pickup}</div></div></div>`;$('consequence').textContent=D.checkout.proConsequence;$('checkoutActions').innerHTML=`<button id="keep" class="primary">${D.checkout.proKeep}</button><button id="change" class="btn">${D.checkout.switchLite}</button><button id="inspect" class="btn">${D.checkout.proInspect}</button>`}$('keep').onclick=()=>checkoutAction('keep');$('change').onclick=()=>checkoutAction('change');$('inspect').onclick=()=>checkoutAction('inspect')}

bindCareer()}
function bindCareer(){document.querySelectorAll('.openOffer').forEach(b=>b.onclick=()=>careerView(Number(b.dataset.i)));document.querySelectorAll('.careerChoose').forEach(b=>b.onclick=()=>careerCommit(b.dataset.k));document.querySelectorAll('.contract').forEach(b=>b.onclick=()=>careerDetail(b.dataset.k,'contract'));document.querySelectorAll('.team').forEach(b=>b.onclick=()=>careerDetail(b.dataset.k,'team'));document.querySelectorAll('.mobility').forEach(b=>b.onclick=()=>careerDetail(b.dataset.k,'mobility'))}
function careerDetail(k,type){const o=P.career.offers[k==='A'?0:1],label=type==='contract'?P.career.labels.contract:type==='team'?P.career.labels.team:D.career.mobility,body=type==='mobility'?(k==='A'?D.career.a:D.career.b):o[type];log('open_detail',{world:'career',object:type+'_'+k});$('careerContent').innerHTML=`<h2>${o.company}</h2><div class="card"><div class="ey">${label}</div><p class="lead" style="font-size:18px">${body}</p></div><button class="btn" onclick="careerView(${k==='A'?1:2})">← ${o.company}</button>`}
function careerCommit(k){S.choices.career=k;log('commit',{world:'career',choice:k,opened:[...S.views.career]});show('travel');travelView(0)}
function travelView(i){S.travelDraft=null;S.travelExpanded=false;S.travelDetail=null;view('travel','nav_'+i);active($('travelNav'),i);const c=$('travelContent'),w=P.travel;if(i===0)c.innerHTML=`<div class="toolbar"><div><div class="ey">${w.brand}</div><h2>${w.title}</h2><div class="meta">${w.meta}</div></div><span class="badge">${w.options.length}</span></div><div class="travelGrid">${w.options.map(o=>`<div class="flightRow"><div><div class="ey">${o.key}</div><div class="flightTimes">${o.time}</div></div><div class="meta">${o.desc}</div><div><div class="flightPrice">${o.price}</div><button class="primary travelChoose" data-k="${o.key}" style="margin-top:8px;width:100%">${w.book} ${o.key}</button></div></div>`).join('')}</div>`;if(i===1)c.innerHTML=`<div class="ey">${w.brand}</div><h2>${w.nav[1]}</h2><div class="timeline"><div class="timeEvent"><b>${w.itinerary}</b><div class="meta">${w.meta}</div></div></div>`;if(i===2)c.innerHTML=travelInfoPage(i,w.airport,D.travel.transportExtra,'transport');if(i===3)c.innerHTML=travelInfoPage(i,w.hotel,D.travel.hotelExtra,'hotel');if(i===4)c.innerHTML=travelInfoPage(i,w.calendar,D.travel.morningExtra,'morning');document.querySelectorAll('.travelChoose').forEach(b=>b.onclick=()=>travelCommit(b.dataset.k));document.querySelectorAll('.travelNested').forEach(b=>b.onclick=()=>openTravelTopDetail(b.dataset.kind,b.dataset.extra))}
function travelInfoPage(i,base,extra,kind){return `<h2>${P.travel.nav[i]}</h2><div class="panel">${base}</div><button class="btn travelNested" data-kind="${kind}" data-extra="${encodeURIComponent(extra)}" style="margin-top:12px">${D.travel.inspect}</button><div id="travelExtra"></div>`}
function openTravelTopDetail(kind,encoded){const extra=decodeURIComponent(encoded);log('open_detail',{world:'travel',object:kind+'_detail'});$('travelExtra').innerHTML=`<div class="notice">${extra}</div>`}
function travelCommit(k){S.travelDraft=k;S.travelExpanded=false;S.travelDetail=null;log('provisional_commit',{world:'travel',choice:k});renderTravelHold()}
function renderTravelHold(){const w=P.travel,o=w.options.find(x=>x.key===S.travelDraft),other=w.options.find(x=>x.key!==S.travelDraft),late=S.travelDraft==='A';active($('travelNav'),0);$('travelContent').innerHTML=`<div class="ey">${D.travel.reviewTitle}</div><h2>${w.title}</h2><div class="card"><div class="object"><span>${D.travel.selected}</span><b>${o.key} · ${o.price}</b></div><div class="object"><span>${o.time}</span><span class="meta">${o.desc}</span></div></div><div class="notice ${late?'':'good'}">${late?D.travel.lateNotice:D.travel.earlyNotice}</div>${S.travelExpanded?renderArrivalObjects():''}<div class="row"><button id="travelConfirm" class="primary">${D.travel.confirm}</button><button id="travelSwitch" class="btn">${D.travel.switch} · ${other.key}</button><button id="travelInspect" class="btn">${D.travel.inspect}</button><button id="travelBack" class="btn">← ${D.travel.back}</button></div>`;bindTravelHold()}
function renderArrivalObjects(){const w=P.travel,d=D.travel;return `<div class="nested"><div class="card"><b>${w.nav[2]}</b><p>${w.airport}</p><button class="link holdDetail" data-kind="transport">→</button></div><div class="card"><b>${w.nav[3]}</b><p>${w.hotel}</p><button class="link holdDetail" data-kind="hotel">→</button></div><div class="card"><b>${w.nav[4]}</b><p>${w.calendar}</p><button class="link holdDetail" data-kind="morning">→</button></div></div><div id="holdDetailOut">${S.travelDetail?`<div class="notice">${S.travelDetail==='transport'?d.transportExtra:S.travelDetail==='hotel'?d.hotelExtra:d.morningExtra}</div>`:''}</div>`}
function bindTravelHold(){$('travelConfirm').onclick=()=>finalizeTravel();$('travelSwitch').onclick=()=>{S.travelDraft=S.travelDraft==='A'?'B':'A';S.travelDetail=null;log('post_consequence_action',{world:'travel',action:'switch_time',choice:S.travelDraft});renderTravelHold()};$('travelInspect').onclick=()=>{S.travelExpanded=true;log('open_detail',{world:'travel',object:'arrival_plan'});renderTravelHold()};$('travelBack').onclick=()=>travelView(0);document.querySelectorAll('.holdDetail').forEach(b=>b.onclick=()=>{S.travelDetail=b.dataset.kind;log('open_detail',{world:'travel',object:b.dataset.kind+'_nested'});renderTravelHold()})}
function finalizeTravel(){const k=S.travelDraft;S.choices.travel=k;log('commit',{world:'travel',choice:k,opened:[...S.views.travel],arrival_plan:S.travelExpanded});finish()}
function navLabel(world,key){const m=String(key||'').match(/^nav_(\d+)$/);const list=P[world]?.nav||[];return m&&list[Number(m[1])]?list[Number(m[1])]:String(key||'')}
function detailLabel(world,obj){
  const o=String(obj||'');
  if(world==='shop'){
    if(o==='affected_devices')return P.shop.deviceTitle;
    if(o==='pickup_option')return P.shop.deliveryTitle;
    const m=o.match(/^device_(\d+)$/);if(m&&P.shop.devices[Number(m[1])])return P.shop.devices[Number(m[1])][0];
  }
  if(world==='career'){
    const m=o.match(/^(contract|team|mobility)_([AB])$/);if(m){const offer=P.career.offers[m[2]==='A'?0:1];const label=m[1]==='contract'?P.career.labels.contract:m[1]==='team'?P.career.labels.team:D.career.mobility;return offer.company+' · '+label}
  }
  if(world==='travel'){
    if(o.includes('transport'))return P.travel.nav[2];
    if(o.includes('hotel'))return P.travel.nav[3];
    if(o.includes('morning'))return P.travel.nav[4];
    if(o==='arrival_plan')return P.travel.itinerary;
  }
  return o.replace(/_/g,' ');
}
function choiceLabel(world,choice){
  if(!choice)return U.map.none;
  if(world==='shop'){const p=P.shop.products.find(x=>x.kind===choice);return p?p.name:String(choice)}
  if(world==='career'){const o=P.career.offers.find(x=>x.key===choice);return o?o.company+' · '+o.role:String(choice)}
  if(world==='travel'){const o=P.travel.options.find(x=>x.key===choice);return o?o.key+' · '+o.time+' · '+o.price:String(choice)}
  return String(choice);
}
function consequenceLabel(world,choice){
  if(world==='shop')return choice==='lite'?P.shop.bridgeReason:D.checkout.proConsequence;
  if(world==='travel')return choice==='A'?D.travel.lateNotice:D.travel.earlyNotice;
  return U.map.choiceOnly;
}
function mapWorldData(world){
  const list=P[world].nav||[],opened=(S.views[world]||[]).map(k=>navLabel(world,k));
  const details=[...new Set(S.events.filter(e=>e.type==='open_detail'&&e.world===world).map(e=>detailLabel(world,e.object)))];
  const missed=list.filter((_,i)=>!(S.views[world]||[]).includes('nav_'+i));
  const choice=S.choices[world]||null;
  const revisions=S.events.filter(e=>e.type==='post_consequence_action'&&e.world===world).length;
  return {world,opened,details,missed,choice,choiceLabel:choiceLabel(world,choice),consequence:consequenceLabel(world,choice),revisions};
}
function renderDecisionMap(){
  const worlds=['shop','career','travel'],data=worlds.map(mapWorldData);
  $('shapeTitle').textContent=U.map.title;$('mapSub').textContent=U.map.sub;$('mapCount').textContent=U.map.stages;
  $('journeyShape').innerHTML=data.map((d,i)=>`<button type="button" class="mapWorld ${i===0?'active':''}" data-world="${d.world}"><span class="mapNum">0${i+1} · ${U.map[d.world]}</span><h3>${d.world==='shop'?P.shop.brand:d.world==='career'?P.career.brand:P.travel.brand}</h3><div class="mapLane"><label>${U.map.opened}</label><span class="mapNode">${d.opened[0]||U.map.empty}</span></div><div class="mapLane"><label>${U.map.decision}</label><span class="mapNode choice">${d.choiceLabel}</span></div><div class="mapLane"><label>${U.map.consequence}</label><span class="mapNode consequence">${d.consequence}</span></div><div class="mapLane"><span class="mapNode missed">${U.map.missed} · ${d.missed.length}</span></div></button>${i<2?'<div class="mapArrow">→</div>':''}`).join('');
  document.querySelectorAll('.mapWorld').forEach(b=>b.onclick=()=>inspectMapWorld(b.dataset.world));
  inspectMapWorld('shop');
}
function inspectMapWorld(world){
  const d=mapWorldData(world);document.querySelectorAll('.mapWorld').forEach(b=>b.classList.toggle('active',b.dataset.world===world));
  const tags=(xs,missed=false)=>xs.length?xs.map(x=>`<span class="inspectTag ${missed?'missed':''}">${x}</span>`).join(''):`<span class="inspectTag ${missed?'missed':''}">${U.map.none}</span>`;
  $('mapInspector').innerHTML=`<div class="inspectGrid"><div class="inspectCol"><h4>${U.map.opened}</h4><div class="inspectList">${tags(d.opened)}</div>${d.details.length?`<h4 style="margin-top:12px">${U.map.details}</h4><div class="inspectList">${tags(d.details)}</div>`:''}</div><div class="inspectCol"><h4>${U.map.missed}</h4><div class="inspectList">${tags(d.missed,true)}</div></div></div><div class="inspectMeta"><span>${U.map.decision}: <b>${d.choiceLabel}</b></span><span>${U.map.revisions}: <b>${d.revisions}</b></span></div>`;
}
function finish(){log('session_complete',{market:P.market});window.PAJGoldenStudy?.complete({family:'PF01',instrument_version:'golden-challenge-v2',locale,market:P.market,world_variant:'golden-three-world-v1',terminal_action:S.choices.travel||'',events:S.events});renderDecisionMap();if(devMode){$('rawTraceCard').classList.remove('hidden');$('trace').innerHTML=S.events.filter(e=>e.type!=='session_start').map(e=>`<div>#${e.seq} · ${e.t_ms}ms · ${e.world||'journey'}${e.object?' / '+e.object:''}${e.choice?' / '+e.choice:''}${e.action?' / '+e.action:''}</div>`).join('');$('researchBox').classList.remove('hidden');$('researchBox').innerHTML='<b>Research view</b><p>Seed world → ordinary consequence → one-sentence structural cue → near transfer → far transfer. This preview is local-only; participant behavior remains separate from downstream interpretation.</p>'}else{$('rawTraceCard').classList.add('hidden');$('researchBox').classList.add('hidden')}show('done')}
function exportTrace(){const payload={instrument:'golden-challenge-v2',locale,market:P.market,world_pack:P.currency,events:S.events,views:S.views,choices:S.choices,seed_consequence:S.consequence,travel_draft:S.travelDraft};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=`paj-golden-${P.market}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
Object.entries(packs).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v.native;$('locale').appendChild(o)});$('locale').value=locale;$('locale').onchange=e=>{locale=e.target.value;history.replaceState(null,'',`?locale=${encodeURIComponent(locale)}${devMode?'&dev=1':''}`);applyPack();show('intro')};$('startBtn').onclick=start;$('checkoutBack').onclick=()=>{show('shop');shopView(0)};$('checkoutDevices').onclick=()=>{show('shop');shopView(1)};$('interventionNext').onclick=careerStart;$('exportBtn').onclick=exportTrace;$('againBtn').onclick=()=>location.reload();applyPack();
